/* Layout: mobile-first single column + fixed bottom nav; ≥960px becomes side rail + 2-column dashboard */
:root {
  --bg: #FFFAF4;
  --surface: #FFFFFF;
  --surface-2: #FFF5F7;
  --ink: #33291F;
  --ink-2: #6E6157;
  --ink-3: #9A8E84;
  --line: #F1E7DE;
  --pink: #F28BAA;
  --pink-ink: #B23A62;
  --pink-soft: #FDE7EE;
  --yellow: #FFD66B;
  --yellow-ink: #8A5F00;
  --yellow-soft: #FFF4D1;
  --green: #66BB8A;
  --green-ink: #2A7350;
  --green-soft: #E4F4EA;
  --blue-ink: #2F6AA8;
  --blue-soft: #E5F0FB;
  --danger-ink: #B8452B;
  --danger-soft: #FDE9E3;
  --shadow: 0 1px 2px rgba(120, 80, 60, .05), 0 8px 24px rgba(120, 80, 60, .07);
  --shadow-lg: 0 18px 50px rgba(80, 50, 40, .18);
  --focus: #B23A62;
  --scrim: rgba(40, 28, 22, .38);
  --font-display: 'Mitr', 'Anuphan', system-ui, sans-serif;
  --font-body: 'Anuphan', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-sm: 12px; --r: 18px; --r-lg: 24px;
  --nav-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161A18; --surface: #1F2522; --surface-2: #2A2227; --ink: #F4EEE8; --ink-2: #C3B9B0; --ink-3: #8F877F; --line: #2F3632;
    --pink: #F49BB6; --pink-ink: #F7B3C8; --pink-soft: #3A2530; --yellow: #F2CD63; --yellow-ink: #F1D27F; --yellow-soft: #3A321E;
    --green: #74C899; --green-ink: #8FD9AE; --green-soft: #1F3329; --blue-ink: #9CC6F2; --blue-soft: #1E2C3B;
    --danger-ink: #F3A28C; --danger-soft: #3B2520; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-lg: 0 18px 50px rgba(0,0,0,.5); --focus: #F7B3C8; --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161A18; --surface: #1F2522; --surface-2: #2A2227; --ink: #F4EEE8; --ink-2: #C3B9B0; --ink-3: #8F877F; --line: #2F3632;
  --pink: #F49BB6; --pink-ink: #F7B3C8; --pink-soft: #3A2530; --yellow: #F2CD63; --yellow-ink: #F1D27F; --yellow-soft: #3A321E;
  --green: #74C899; --green-ink: #8FD9AE; --green-soft: #1F3329; --blue-ink: #9CC6F2; --blue-soft: #1E2C3B;
  --danger-ink: #F3A28C; --danger-soft: #3B2520; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-lg: 0 18px 50px rgba(0,0,0,.5); --focus: #F7B3C8; --scrim: rgba(0,0,0,.6); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; line-height: 1.3; margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.08rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pink-ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); } .small { font-size: .9rem; } .tiny { font-size: .82rem; color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- App shell ---------- */
.app { min-height: 100%; display: flex; }
.main { flex: 1; min-width: 0; padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; }
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.header.scrolled { border-bottom-color: var(--line); }
.header-in { display: flex; align-items: center; gap: 8px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 1.15rem; font-weight: 500; flex: 1; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 12px; background: var(--pink-soft); display: grid; place-items: center; font-size: 1.1rem; }
.header-title { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; position: relative; font-size: 1.2rem; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pink-ink); color: var(--surface); font-size: .7rem; line-height: 18px; font-weight: 600; }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* bottom nav */
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -6px 20px rgba(80, 50, 40, .05); }
.bnav ul { list-style: none; margin: 0 auto; padding: 0 4px; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 560px; }
.bnav button { width: 100%; min-height: var(--nav-h); border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-2); font-size: .78rem; border-radius: 16px; }
.bnav .ico { font-size: 1.3rem; line-height: 1; width: 48px; height: 30px; display: grid; place-items: center; border-radius: 15px; transition: background .2s; }
.bnav button[aria-current="page"] { color: var(--pink-ink); font-weight: 600; }
.bnav button[aria-current="page"] .ico { background: var(--pink-soft); }

@media (min-width: 960px) {
  .main { padding-bottom: 40px; }
  .bnav { position: sticky; top: 0; height: 100vh; width: 228px; flex: none; border-top: 0; border-right: 1px solid var(--line); box-shadow: none; padding: 20px 12px; order: -1; }
  .bnav .rail-brand { display: flex; }
  .bnav ul { grid-template-columns: 1fr; gap: 4px; max-width: none; }
  .bnav button { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 12px; min-height: 52px; font-size: 1rem; }
  .wrap { max-width: 1040px; padding-inline: 32px; }
  .header .brand { visibility: hidden; }
}
.rail-brand { display: none; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.2rem; padding: 4px 8px 20px; }

/* ---------- Page ---------- */
.page { display: grid; gap: 20px; padding-block: 8px 24px; }
.page-head { display: grid; gap: 4px; }
.section { display: grid; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 1.15rem; }
.link-btn { border: 0; background: none; color: var(--pink-ink); font-weight: 600; cursor: pointer; padding: 10px 4px; min-height: 44px; }
.grid-2 { display: grid; gap: 20px; }
@media (min-width: 960px) { .grid-2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }

/* ---------- Cards ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card.tint-pink { background: var(--pink-soft); box-shadow: none; }
.card.tint-yellow { background: var(--yellow-soft); box-shadow: none; }
.card.tint-green { background: var(--green-soft); box-shadow: none; }
.card.tint-blue { background: var(--blue-soft); box-shadow: none; }
.card.tint-danger { background: var(--danger-soft); box-shadow: none; }

/* Hero (dashboard greeting) */
.hero { border-radius: var(--r-lg); padding: 20px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -70px; top: -70px; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, var(--yellow-soft) 0 55%, transparent 56%); z-index: 0; }
.hero > * { position: relative; z-index: 1; }
.hero .hello { color: var(--ink-2); }
.hero h1 { font-size: 1.5rem; }
.hero .count { font-family: var(--font-display); color: var(--pink-ink); font-size: 2.6rem; line-height: 1; }
.hero-row { display: flex; align-items: center; gap: 14px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; cursor: pointer; font-weight: 600; text-decoration: none; transition: transform .12s, background .2s; background: var(--surface-2); color: var(--ink); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--pink-ink); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.green { background: var(--green-ink); color: var(--surface); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.danger { background: var(--danger-soft); color: var(--danger-ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: .92rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 25; box-shadow: var(--shadow-lg); }
@media (min-width: 960px) { .fab { bottom: 32px; right: 32px; } }

/* choice chips / option tiles */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: .92rem; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--pink-soft); border-color: var(--pink); color: var(--pink-ink); font-weight: 600; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.options { display: grid; gap: 10px; }
.options.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.options.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (min-width: 600px) { .options.cols-3w { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.option { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; min-height: 56px; cursor: pointer; display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s; }
.option .o-emoji { font-size: 1.5rem; flex: none; }
.option .o-text { display: grid; min-width: 0; }
.option .o-desc { font-size: .85rem; color: var(--ink-2); }
.option[aria-checked="true"], .option[aria-pressed="true"] { border-color: var(--pink); background: var(--pink-soft); }
.option.center { flex-direction: column; text-align: center; justify-content: center; gap: 6px; }
.soil-opts .option { flex-direction: column; justify-content: center; text-align: center; gap: 4px; min-height: 92px; font-weight: 600; }
.soil-opts .option .o-emoji { font-size: 1.8rem; }

/* species picker tiles */
.species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.sp-tile { border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 6px; cursor: pointer; display: grid; justify-items: center; gap: 4px; text-align: center; font-size: .9rem; position: relative; min-width: 0; }
.sp-tile svg { width: 60px; height: 60px; }
.sp-tile[aria-checked="true"], .sp-tile[aria-pressed="true"] { border-color: var(--pink); background: var(--pink-soft); }
.sp-tile[aria-checked="true"]::after { content: "✓"; position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--pink-ink); color: var(--surface); font-size: .8rem; display: grid; place-items: center; }
.sp-tile .sp-diff { font-size: .74rem; color: var(--ink-3); }

/* ---------- Forms ---------- */
.field { display: grid; gap: 6px; }
.field label, .field .label { font-weight: 600; font-size: .95rem; }
.field .hint { font-size: .85rem; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px 14px; font-size: 1rem; }
textarea.input { min-height: 88px; resize: vertical; }
.input:focus { border-color: var(--pink); outline: none; box-shadow: 0 0 0 3px var(--pink-soft); }
.field.err .input { border-color: var(--danger-ink); }
.err-msg { color: var(--danger-ink); font-size: .87rem; }
.form { display: grid; gap: 16px; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.check-row input { width: 22px; height: 22px; accent-color: var(--pink-ink); }

/* ---------- Tasks ---------- */
.task-list { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.task { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 8px 6px 6px; min-height: 64px; transition: opacity .3s; }
.task.done { box-shadow: none; background: transparent; border: 1px dashed var(--line); }
.task.done .t-title { text-decoration: line-through; color: var(--ink-3); }
.tcheck { width: 48px; height: 48px; flex: none; border: 0; background: none; cursor: pointer; display: grid; place-items: center; border-radius: 14px; }
.tcheck .box { width: 28px; height: 28px; border-radius: 9px; border: 2.5px solid var(--pink); display: grid; place-items: center; transition: background .2s, transform .2s; }
.tcheck .box svg { width: 16px; height: 16px; stroke: var(--surface); stroke-width: 3.5; fill: none; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s; }
.task.done .tcheck .box { background: var(--green-ink); border-color: var(--green-ink); }
.task.done .tcheck .box svg { stroke-dashoffset: 0; }
.tcheck.pop .box { animation: pop .4s; }
@keyframes pop { 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.t-body { flex: 1; min-width: 0; border: 0; background: none; text-align: left; cursor: pointer; padding: 8px 4px; display: grid; gap: 2px; border-radius: 12px; }
.t-title { font-weight: 600; }
.t-meta { font-size: .84rem; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.t-chev { color: var(--ink-3); flex: none; padding-right: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.pink { background: var(--pink-soft); color: var(--pink-ink); } .tag.green { background: var(--green-soft); color: var(--green-ink); }
.tag.yellow { background: var(--yellow-soft); color: var(--yellow-ink); } .tag.blue { background: var(--blue-soft); color: var(--blue-ink); }
.tag.danger { background: var(--danger-soft); color: var(--danger-ink); }

/* progress */
.progress { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--yellow)); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.progress.pink > span { background: linear-gradient(90deg, var(--pink), var(--yellow)); }
.prog-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

/* ---------- Plant cards ---------- */
.plant-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.pcard { display: flex; gap: 14px; align-items: center; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; border: 0; text-align: left; cursor: pointer; width: 100%; min-width: 0; }
.pcard:hover { transform: translateY(-1px); }
.pthumb { width: 76px; height: 76px; border-radius: 18px; overflow: hidden; flex: none; background: var(--surface-2); display: grid; place-items: center; }
.pthumb img { width: 100%; height: 100%; object-fit: cover; }
.pthumb svg { width: 100%; height: 100%; }
.pinfo { display: grid; gap: 4px; min-width: 0; flex: 1; }
.pname { font-family: var(--font-display); font-size: 1.08rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmeta { font-size: .86rem; color: var(--ink-2); }
.badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-plants { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; margin-inline: -16px; scrollbar-width: none; }
.mini-plants::-webkit-scrollbar { display: none; }
.mini-plant { flex: none; width: 92px; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 4px; text-align: center; font-size: .85rem; padding: 4px; border-radius: 16px; }
.mini-plant .pthumb { width: 72px; height: 72px; border-radius: 50%; position: relative; overflow: visible; }
.mini-plant .pthumb > :first-child { border-radius: 50%; overflow: hidden; width: 100%; height: 100%; }
.mini-plant .cnt { position: absolute; right: -2px; top: -2px; background: var(--pink-ink); color: var(--surface); min-width: 22px; height: 22px; border-radius: 11px; font-size: .75rem; display: grid; place-items: center; font-weight: 700; border: 2px solid var(--bg); }

/* Plant detail */
.pd-hero { border-radius: var(--r-lg); overflow: hidden; background: var(--surface-2); aspect-ratio: 16 / 10; max-height: 340px; width: 100%; position: relative; display: grid; place-items: center; }
.pd-hero img { width: 100%; height: 100%; object-fit: cover; }
.pd-hero svg { width: 62%; height: 100%; max-width: 260px; }
.pd-hero .pd-photo-btn { position: absolute; right: 12px; bottom: 12px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; }
.fact .k { font-size: .78rem; color: var(--ink-2); } .fact .v { font-family: var(--font-display); font-size: 1.05rem; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; border: 0; background: none; min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--pink-ink); box-shadow: var(--shadow); }
.care-row { display: flex; gap: 12px; align-items: flex-start; }
.care-ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.3rem; flex: none; }
.care-ico.yellow { background: var(--yellow-soft); } .care-ico.blue { background: var(--blue-soft); } .care-ico.green { background: var(--green-soft); } .care-ico.pink { background: var(--pink-soft); }

/* Stage path */
.stage-path { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; position: relative; }
.stage { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: .74rem; color: var(--ink-3); position: relative; }
.stage .s-dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 1.1rem; position: relative; z-index: 1; filter: grayscale(.8); opacity: .7; }
.stage.done .s-dot { background: var(--green-soft); filter: none; opacity: 1; }
.stage.now .s-dot { background: var(--pink-soft); filter: none; opacity: 1; box-shadow: 0 0 0 3px var(--pink); }

<script>
"use strict";
/* ==== core/utils.js ==== */
/* ============================================================
 * core/utils.js — วันที่ไทย, escape, id, validation helpers
 * ============================================================ */
const U = (() => {
  const TH_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const TH_DAYS_SHORT = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  const TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  let dayOffset = 0; // ใช้สำหรับ "จำลองวัน" ในโหมดทดลอง

  const pad = n => String(n).padStart(2, '0');
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const now = () => { const d = new Date(); if (dayOffset) d.setDate(d.getDate() + dayOffset); return d; };

  return {
    TH_MONTHS_SHORT, TH_MONTHS, TH_DAYS_SHORT, TH_DAYS,
    setDayOffset(n) { dayOffset = Number(n) || 0; },
    getDayOffset() { return dayOffset; },
    now,
    nowISO() { return now().toISOString(); },
    uid(p = 'id') { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
    esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },
    dateKey, parseKey,
    todayKey() { return dateKey(now()); },
    addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); },
    /** a - b เป็นจำนวนวัน */
    diffDays(a, b) { return Math.round((parseKey(a) - parseKey(b)) / 86400000); },
    isValidKey(k) {
      if (typeof k !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
      return dateKey(parseKey(k)) === k;
    },
    fmtDate(k, { year = true, weekday = false } = {}) {
      if (!k) return '-';
      const d = parseKey(k.slice(0, 10));
      const base = `${d.getDate()} ${TH_MONTHS_SHORT[d.getMonth()]}${year ? ' ' + (d.getFullYear() + 543) : ''}`;
      return weekday ? `${TH_DAYS[d.getDay()]} ${base}` : base;
    },
    fmtTime(iso) { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())} น.`; },
    fmtDateTime(iso) { const d = new Date(iso); return `${U.fmtDate(dateKey(d))} · ${U.fmtTime(iso)}`; },
    isoToKey(iso) { return dateKey(new Date(iso)); },
    startOfWeek(k) { const d = parseKey(k); d.setDate(d.getDate() - d.getDay()); return dateKey(d); },
    /** normalize ข้อความไทย/อังกฤษสำหรับค้นหา */
    norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, '').normalize('NFC'); },
    clamp(n, a, b) { return Math.max(a, Math.min(b, n)); },
    debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  };
})();

/* ==== data/provinces.js ==== */
/* ============================================================
 * data/provinces.js — 77 จังหวัด + ภูมิภาค (เตรียมขยาย Climate Zone)
 * ============================================================ */
const PROVINCES = (() => {
  const R = {
    C: ['กรุงเทพมหานคร','กำแพงเพชร','ชัยนาท','นครนายก','นครปฐม','นครสวรรค์','นนทบุรี','ปทุมธานี','พระนครศรีอยุธยา','พิจิตร','พิษณุโลก','เพชรบูรณ์','ลพบุรี','สมุทรปราการ','สมุทรสงคราม','สมุทรสาคร','สิงห์บุรี','สุโขทัย','สุพรรณบุรี','สระบุรี','อ่างทอง','อุทัยธานี'],
    N: ['เชียงราย','เชียงใหม่','น่าน','พะเยา','แพร่','แม่ฮ่องสอน','ลำปาง','ลำพูน','อุตรดิตถ์'],
    NE: ['กาฬสินธุ์','ขอนแก่น','ชัยภูมิ','นครพนม','นครราชสีมา','บึงกาฬ','บุรีรัมย์','มหาสารคาม','มุกดาหาร','ยโสธร','ร้อยเอ็ด','เลย','ศรีสะเกษ','สกลนคร','สุรินทร์','หนองคาย','หนองบัวลำภู','อำนาจเจริญ','อุดรธานี','อุบลราชธานี'],
    E: ['จันทบุรี','ฉะเชิงเทรา','ชลบุรี','ตราด','ปราจีนบุรี','ระยอง','สระแก้ว'],
    W: ['กาญจนบุรี','ตาก','ประจวบคีรีขันธ์','เพชรบุรี','ราชบุรี'],
    S: ['กระบี่','ชุมพร','ตรัง','นครศรีธรรมราช','นราธิวาส','ปัตตานี','พังงา','พัทลุง','ภูเก็ต','ระนอง','สตูล','สงขลา','สุราษฎร์ธานี','ยะลา'],
  };
  const list = [];
  Object.entries(R).forEach(([region, names]) => names.forEach(name => list.push({ name, region })));
  list.sort((a, b) => a.name.localeCompare(b.name, 'th'));
  return list;
})();

const DEFAULT_PROVINCE = 'ลพบุรี';

/** RegionService — ไม่ hard-code จังหวัด ใช้คืนค่า climate profile สำหรับอนาคต */
const RegionService = {
  regionOf(name) { return (PROVINCES.find(p => p.name === name) || {}).region || 'C'; },
  climateProfile(name) {
    const r = this.regionOf(name);
    const map = {
      C: 'ร้อนชื้น ช่วงบ่ายร้อนจัด', N: 'ร้อนกลางวัน เย็นช่วงหน้าหนาว', NE: 'ร้อนและแล้งช่วงหน้าร้อน',
      E: 'ร้อนชื้น ฝนชุก', W: 'ร้อน แห้งบางช่วง', S: 'ฝนชุก ความชื้นสูง',
    };
    return { region: r, summary: map[r] };
  },
};

/* ==== data/species.js ==== */
/* ============================================================
 * data/species.js — ฐานข้อมูลพืช (Data Layer แยกจาก UI)
 * เพิ่มต้นไม้ใหม่ = เพิ่ม object ใน array นี้ (หรือย้ายไป API ภายหลัง)
 * ข้อมูลเป็นแนวทางทั่วไป ไม่รับประกันผล ขึ้นกับพันธุ์และสภาพแวดล้อม
 * ============================================================ */

const SYMPTOM_FLOW = {
  yellow: ['where', 'soil', 'water3d', 'sun', 'pestsSeen', 'onset'],
  wilt: ['wiltTime', 'soil', 'water3d', 'sun', 'onset'],
  spots: ['spotType', 'soil', 'water3d', 'onset'],
  pests: ['pestType', 'onset'],
  nogrowth: ['sun', 'soil', 'water3d', 'fert'],
  noflower: ['sun', 'fert', 'pruned', 'water3d'],
  soggy: ['drainage', 'water3d', 'onset'],
  burn: ['movedSun', 'sun', 'soil', 'fert'],
  unknown: ['soil', 'sun', 'water3d', 'pestsSeen', 'onset'],

const RuleBasedDiagnosisService = {
  getSymptoms() { return DOCTOR_SYMPTOMS; },
  getQuestions(symptom) { return (SYMPTOM_FLOW[symptom] || []).map(id => ({ id, ...DOCTOR_QUESTIONS[id] })); },

  /**
   * @param {{symptom:string, answers:Object, species?:Object, plantAgeDays?:number|null}} input
   * @returns {{causes:{title:string,why:string}[], checks:string[], actions:string[], safety:boolean, followUp:string}}
   */
  diagnose({ symptom, answers: a, species, plantAgeDays }) {
    const causes = [], checks = [], actions = [];
    const add = (arr, ...items) => items.forEach(i => { if (!arr.includes(i)) arr.push(i); });
    const cause = (title, why) => causes.push({ title, why });
    let safety = false;
    const young = plantAgeDays != null && plantAgeDays <= 14;
    const shadeLover = species && species.sunlight.minHours <= 3;
    const sunLow = a.sun === 'lt3' || (a.sun === '3to5' && species && species.sunlight.minHours >= 6);

    const waterTooMuch = () => {
      cause('อาจเกิดจากน้ำมากเกินไป หรือดินระบายน้ำไม่ดี', 'ดินยังชื้นหรือแฉะ และรดน้ำค่อนข้างบ่อย รากที่แช่น้ำนานจะหายใจไม่ได้');
      add(checks, 'ดูก้นกระถางว่ามีน้ำขัง หรือรูระบายน้ำตันไหม', 'ดมดินว่ามีกลิ่นเหม็นอับไหม', 'ดูโคนต้นว่านิ่มหรือดำไหม');
      add(actions, 'งดรดน้ำจนดินลึก 2–3 ซม. แห้ง แล้วค่อยรด', 'เทน้ำในจานรองกระถางออก', 'ถ้าปลูกลงดินแล้วน้ำขัง ลองพูนดินโคนต้นให้สูงขึ้น หรือทำร่องให้น้ำไหลออก');
    };
    const waterTooLittle = () => {
      cause('อาจเกิดจากน้ำไม่พอ', 'ดินแห้งและไม่ค่อยได้รดน้ำ ต้นจึงดึงน้ำไปใช้ไม่ทัน');
      add(checks, 'ดูว่าดินแห้งแข็ง หรือหดตัวออกจากขอบกระถางไหม');
      add(actions, 'รดน้ำช้า ๆ จนน้ำไหลออกก้นกระถาง', 'ตรวจดินทุกเช้า และรดเมื่อดินลึก 2–3 ซม. แห้ง', 'ถ้าเป็นช่วงร้อนจัด ลองย้ายกระถางให้ได้ร่มช่วงบ่าย');
    };
    const pestsSuck = () => {
      safety = true;
      cause('อาจเกิดจากแมลงดูดน้ำเลี้ยง เช่น เพลี้ยหรือไรแดง', 'แมลงตัวเล็กดูดน้ำเลี้ยงจากใบ ทำให้ใบซีด เหลือง หรือหงิก');
      add(checks, 'พลิกดูใต้ใบและยอดอ่อน ใช้แว่นขยายถ้ามี', 'ดูว่ามีมดเดินขึ้นลงต้นไหม (มักมากับเพลี้ย)');
      add(actions, 'ฉีดน้ำแรง ๆ ล้างใต้ใบ หรือเช็ดด้วยผ้าชุบน้ำ', 'ตัดใบหรือยอดที่เป็นมากทิ้ง ใส่ถุงมัดปากก่อนทิ้ง', 'แยกต้นนี้ออกจากต้นอื่นชั่วคราว');
    };
    const lightLow = () => {
      cause('อาจเกิดจากแสงแดดไม่พอ', species ? `${species.nameTh} ${species.sunlight.label} (${species.sunlight.text})` : 'ไม้ดอกส่วนใหญ่ต้องการแดดหลายชั่วโมงต่อวัน');
      add(checks, 'สังเกตตำแหน่งปลูกตอน 9 โมง เที่ยง บ่าย 3 ว่าโดนแดดไหม');
      add(actions, 'ถ้าปลูกกระถาง ค่อย ๆ ย้ายไปที่แดดมากขึ้น (เพิ่มทีละน้อยใน 1 สัปดาห์ ป้องกันใบไหม้)');
    };

    switch (symptom) {
      case 'yellow': {
        if (a.soil === 'wet' || (a.soil === 'moist' && a.water3d === '3+')) waterTooMuch();
        if (a.soil === 'dry' && (a.water3d === '0' || a.water3d === 'unsure')) waterTooLittle();
        if (a.pestsSeen === 'yes') pestsSuck();
        if (a.where === 'lower' && a.soil !== 'wet') {
          cause('อาจเป็นใบแก่ที่หมดอายุตามธรรมชาติ หรือธาตุอาหารเริ่มไม่พอ', 'ถ้าเหลืองแค่ใบล่าง ๆ ไม่กี่ใบ มักเป็นเรื่องปกติ แต่ถ้าเหลืองขึ้นเรื่อย ๆ ต้นอาจขาดอาหาร');
          add(actions, 'เด็ดใบเหลืองออกได้', plantAgeDays != null && plantAgeDays > 30 ? 'ถ้ายังไม่เคยใส่ปุ๋ยเลย พิจารณาใส่ปุ๋ยตามอัตราบนฉลาก' : 'ถ้าต้นยังปลูกไม่ถึง 1 เดือน ยังไม่ต้องรีบใส่ปุ๋ย');
        }
        if (a.where === 'top') {
          cause('อาจเกี่ยวกับสภาพดินหรือธาตุอาหารรอง', 'ยอดอ่อนเหลืองซีดแต่เส้นใบยังเขียว พบบ่อยในพุดและเข็มที่ชอบดินเป็นกรดเล็กน้อย');
          add(checks, 'ดูว่าใบเหลืองแต่เส้นใบยังเขียวไหม');
          add(actions, 'ถ่ายรูปใบไปปรึกษาร้านต้นไม้ใกล้บ้าน เรื่องการปรับดินหรือปุ๋ยที่เหมาะ');
        }
        if (sunLow) lightLow();
        if (young) cause('อาจเป็นช่วงปรับตัวหลังย้ายปลูก', 'ต้นที่เพิ่งปลูกไม่ถึง 2 สัปดาห์ อาจมีใบเหลืองร่วงบ้างระหว่างรากกำลังเดิน');
        break;
      }
      case 'wilt': {
        if (a.wiltTime === 'afternoon' && a.soil !== 'dry') {
          cause('อาจเป็นการเหี่ยวชั่วคราวจากอากาศร้อน', 'ช่วงบ่ายต้นคายน้ำเร็วกว่าที่รากดูดทัน ถ้าฟื้นตอนเย็นถือว่าปกติ');
          add(actions, 'ไม่ต้องรดน้ำเพิ่มถ้าดินยังชื้น', 'ถ้าเหี่ยวทุกวัน ลองให้ร่มช่วงบ่าย');
        }
        if (a.soil === 'dry') waterTooLittle();
        if ((a.soil === 'wet' || a.soil === 'moist') && a.wiltTime === 'always') {
          waterTooMuch();
          cause('มีความเป็นไปได้ว่ารากเสียหาย (รากเน่า)', 'ต้นเหี่ยวทั้งที่ดินชื้น อาจเพราะรากไม่สามารถดูดน้ำได้');
          add(checks, 'ถ้าปลูกกระถาง ลองค่อย ๆ ดูรากด้านล่าง รากดีมักเป็นสีขาว/ครีม รากเสียมักดำและนิ่ม');
        }
        if (young) cause('อาจเป็นอาการช็อกหลังย้ายปลูก', 'รากยังเดินไม่เต็มที่ ต้นจะเหี่ยวง่ายใน 1–2 สัปดาห์แรก');
        if (young) add(actions, 'ให้ร่มรำไรช่วงบ่ายสัก 3–5 วัน', 'อย่าย้ายต้นหรือรบกวนรากซ้ำ');
        break;
      }
      case 'spots': {
        safety = true;
        if (a.spotType === 'white') {
          cause('อาจเป็นราแป้ง', 'ผงขาวบนใบ มักเกิดเมื่ออากาศชื้นและลมไม่ถ่ายเท');
          add(actions, 'ตัดใบที่เป็นมากทิ้ง', 'จัดให้ลมผ่านสะดวก อย่าวางกระถางชิดกันเกินไป', 'รดน้ำที่โคน ไม่รดโดนใบ และรดตอนเช้า');
        } else if (a.spotType === 'brown') {
          cause('อาจเป็นโรคใบจุด', 'จุดน้ำตาลมีขอบเหลือง พบบ่อยช่วงฝนชุกหรือใบเปียกนาน');
          add(actions, 'เด็ดใบที่เป็นจุดทิ้ง ไม่ทิ้งไว้ใต้ต้น', 'รดน้ำที่โคน หลีกเลี่ยงการรดโดนใบตอนเย็น');
        } else if (a.spotType === 'black') {
          pestsSuck();
          cause('อาจเป็นราดำ', 'คราบดำมักขึ้นตามน้ำหวานที่เพลี้ยขับออกมา แก้ที่ต้นเหตุคือแมลง');
          add(actions, 'เช็ดคราบดำออกด้วยผ้าชุบน้ำ');
        } else if (a.spotType === 'speckle') {
          pestsSuck();
        }
        if (a.soil === 'wet') waterTooMuch();
        add(checks, 'ดูว่าจุดลามไปใบอื่นเร็วไหม ถ่ายรูปเก็บไว้เทียบใน 2–3 วัน');
        break;
      }
      case 'pests': {
        safety = true;
        const t = a.pestType;
        if (t === 'aphid' || t === 'mealy' || t === 'mite') pestsSuck();
        if (t === 'mealy') cause('อาจเป็นเพลี้ยแป้ง', 'ปุยขาวคล้ายสำลีตามซอกใบและยอด');
        if (t === 'mite') cause('อาจเป็นไรแดง', 'พบบ่อยช่วงอากาศร้อนแห้ง ใบซีดเป็นจุดเล็ก ๆ มีใยบาง');
        if (t === 'mite') add(actions, 'ฉีดน้ำใต้ใบช่วงเช้า ช่วยลดไรแดงได้');
        if (t === 'worm') {
          cause('อาจเป็นหนอนกินใบหรือหนอนเจาะดอก', 'หนอนมักซ่อนใต้ใบ มีมูลเม็ดเล็ก ๆ ให้เห็น');
          add(checks, 'พลิกใต้ใบตามรอยแหว่ง', 'ดูดอกตูมว่ามีรูไหม');
          add(actions, 'สวมถุงมือ เก็บหนอนออก', 'ตรวจซ้ำช่วงเช้าหรือเย็นทุกวันสัก 3 วัน');
        }
        if (t === 'holes') {
          cause('อาจเป็นแมลงกัดกินใบ หนอน หรือหอยทาก', 'ถ้าไม่เห็นตัวตอนกลางวัน อาจออกหากินตอนกลางคืน');
          add(checks, 'ส่องไฟฉายดูตอนกลางคืน');
          add(actions, 'เก็บออกด้วยมือ', 'เก็บใบไม้แห้งรอบโคนต้นที่เป็นที่หลบซ่อน');
        }
        break;
      }
      case 'nogrowth': {
        if (young) cause('อาจยังอยู่ในช่วงตั้งตัว', 'ช่วง 1–2 สัปดาห์แรก รากกำลังเดิน ส่วนบนอาจดูไม่โต เป็นเรื่องปกติ');
        if (sunLow) lightLow();
        if (a.soil === 'wet') waterTooMuch();
        if (a.soil === 'dry' && a.water3d === '0') waterTooLittle();
        if (a.fert === 'never' && plantAgeDays != null && plantAgeDays > 30) {
          cause('อาจขาดธาตุอาหาร', 'ปลูกมาเกิน 1 เดือนแล้วยังไม่เคยใส่ปุ๋ย ดินในกระถางมีอาหารจำกัด');
          add(actions, 'ใส่ปุ๋ยตามอัตราบนฉลากผลิตภัณฑ์ และจดบันทึกไว้');
        }
        add(checks, 'ถ้าปลูกกระถาง ดูว่ารากโผล่ออกก้นกระถางไหม (กระถางอาจเล็กเกินไป)');
        break;
      }
      case 'noflower': {
        const minDay = species ? species.floweringStartDay : null;
        if (minDay && plantAgeDays != null && plantAgeDays < minDay) {
          cause('อาจยังไม่ถึงช่วงออกดอก', `${species.nameTh} มักเริ่มออกดอกหลังปลูกประมาณ ${minDay} วันขึ้นไป แต่ขึ้นกับพันธุ์และอายุต้นตอนซื้อ ไม่ใช่วันที่แน่นอน`);
        }
        if (sunLow || a.sun === '3to5') lightLow();
        if (a.fert === 'often') {
          cause('อาจได้ปุ๋ยมากเกินไป โดยเฉพาะไนโตรเจน', 'ปุ๋ยที่ตัวเลขแรก (N) สูง ทำให้ใบเขียวเยอะแต่ดอกน้อย');
          add(actions, 'หยุดใส่ปุ๋ยสักพัก แล้วกลับมาใช้ตามอัตราบนฉลาก');
        }
        if (a.pruned === 'yes') cause('อาจตัดแต่งกิ่งไปพร้อมตาดอก', 'ต้นต้องใช้เวลาแตกกิ่งใหม่ก่อนจะออกดอกรุ่นต่อไป');
        if (a.water3d === '3+' && species && species.waterNeed === 'low') {
          cause('อาจได้น้ำมากเกินไปสำหรับต้นชนิดนี้', `${species.nameTh} ชอบดินค่อนข้างแห้ง ถ้าน้ำมากมักแตกแต่ใบ`);
          add(actions, 'รดน้ำเฉพาะเมื่อดินแห้งจริง ๆ');
        }
        add(checks, 'ดูปลายกิ่งว่ามีตาดอกเล็ก ๆ เริ่มขึ้นไหม');
        break;
      }
      case 'soggy': {
        waterTooMuch();
        if (a.drainage === 'pot-noholes') {
          cause('อาจเกิดจากกระถางไม่มีรูระบายน้ำ', 'น้ำไม่มีทางออก จะขังอยู่ก้นกระถาง');
          add(actions, 'ย้ายไปปลูกในกระถางที่มีรู หรือเจาะรูเพิ่มที่ก้นกระถาง');
        }
        if (a.drainage === 'ground') add(checks, 'ดูว่าตรงนั้นเป็นแอ่งที่น้ำฝนไหลมารวมไหม');
        break;
      }
      case 'burn': {
        if (a.movedSun === 'yes') {
          cause('อาจเป็นใบไหม้แดดจากการปรับตัวไม่ทัน', 'ต้นที่เคยอยู่ร่มแล้วโดนแดดแรงทันที ใบจะไหม้เป็นปื้นซีดหรือน้ำตาล');
          add(actions, 'ให้ร่มรำไรช่วงบ่าย แล้วค่อย ๆ เพิ่มแดดทีละน้อยใน 1–2 สัปดาห์');
        }
        if (shadeLover && (a.sun === '5to7' || a.sun === 'gt7')) {
          cause('อาจได้แดดแรงเกินไปสำหรับต้นชนิดนี้', `${species.nameTh} ${species.sunlight.label}`);
          add(actions, 'ย้ายไปที่แสงรำไร หรือใต้ชายคา/ซาแรน');
        }
        if (a.fert === 'often') {
          cause('มีความเป็นไปได้ว่าปุ๋ยมากเกินไป', 'ปุ๋ยเข้มข้นทำให้ขอบใบไหม้ได้');
          add(actions, 'หยุดใส่ปุ๋ย รดน้ำให้ชุ่มเพื่อช่วยชะปุ๋ยส่วนเกิน (ถ้าดินระบายน้ำดี)');
        }
        if (a.soil === 'dry') waterTooLittle();
        add(actions, 'ตัดเฉพาะส่วนที่ไหม้แห้งออกได้ ใบที่ไหม้แล้วจะไม่กลับมาเขียว');
        break;
      }
      default: {
        if (a.soil === 'wet') waterTooMuch();
        if (a.soil === 'dry') waterTooLittle();
        if (a.pestsSeen === 'yes') pestsSuck();
        if (a.sun === 'lt3') lightLow();
        add(checks, 'ดูใบทั้งด้านบนและใต้ใบ', 'ดูโคนต้นและผิวดิน', 'ถ่ายรูปไว้เทียบใน 2–3 วัน');
      }
    }

    if (!causes.length) {
      cause('ยังระบุสาเหตุที่ชัดเจนไม่ได้จากข้อมูลตอนนี้', 'อาการอาจเกิดจากหลายปัจจัยร่วมกัน ลองสังเกตต่อและบันทึกภาพไว้');
      add(checks, 'ดูดินทุกเช้าก่อนรดน้ำ', 'ดูใต้ใบหาแมลง', 'ถ่ายรูปเทียบทุก 2–3 วัน');
    }
    if (a.soil === 'unsure') add(checks, 'ลองใช้นิ้วจิ้มดินลึก 2–3 ซม. เพื่อดูความชื้นจริง');
    add(actions, 'ถ่ายรูปบันทึกไว้ แล้วกลับมาดูอีกใน 3 วัน');
    return {
      causes, checks, actions, safety,
      followUp: 'ถ้าอาการไม่ดีขึ้นใน 1–2 สัปดาห์ หรือลามเร็ว ลองนำรูปไปปรึกษาร้านต้นไม้หรือผู้เชี่ยวชาญใกล้บ้าน',
    };
  },
};

/** Notification channels — InApp (MVP). อนาคต: BrowserPushChannel, PWAChannel */
class InAppNotificationChannel {
  constructor(repo) { this.repo = repo; }
  async send(n) {
    const exists = this.repo.db.notifications.some(x => x.dedupeKey && x.dedupeKey === n.dedupeKey);
    if (exists) return false;
    this.repo.db.notifications.unshift({ id: U.uid('ntf'), read: false, createdAt: U.nowISO(), ...n });
    this.repo.db.notifications = this.repo.db.notifications.slice(0, 60);
    return true;
  }
}

class NotificationService {
  constructor(channels) { this.channels = channels; }
  async notify(n) { let sent = false; for (const c of this.channels) sent = (await c.send(n)) || sent; return sent; }
}

/* ==== data-access/storage.js ==== */
/* ============================================================
 * data-access/storage.js — Repository + Adapters
 * UI → Logic → Repository → Adapter (localStorage | memory | API ในอนาคต)
 * เปลี่ยน backend: เขียน ApiAdapter ที่มี load()/save() แล้วส่งเข้า Repository
 * ============================================================ */
const SCHEMA_VERSION = 1;
const STORAGE_KEY = 'suan-khong-chan:v1';

class LocalStorageAdapter {
  constructor(key) { this.key = key; this.persistent = true; }
  async load() { const raw = localStorage.getItem(this.key); return raw ? JSON.parse(raw) : null; }
  async save(data) { localStorage.setItem(this.key, JSON.stringify(data)); }
  async clear() { localStorage.removeItem(this.key); }
}
class MemoryAdapter {
  constructor() { this.data = null; this.persistent = false; }
  async load() { return this.data; }
  async save(data) { this.data = JSON.parse(JSON.stringify(data)); }
  async clear() { this.data = null; }
}

const emptyDB = () => ({
  schemaVersion: SCHEMA_VERSION,
  user: null,
  gardens: [],
  plants: [],          // UserPlant
  tasks: [],           // custom/one-time Task (garden prep, follow-up, user-added)
  taskState: {},       // { [taskId]: { completed, completedAt, result } } สำหรับงานจาก engine
  waterLogs: [],
  fertilizers: [],     // ผลิตภัณฑ์ปุ๋ยของผู้ใช้
  fertilizerLogs: [],
  photoLogs: [],       // imageUrl = "idb:<id>"
  notifications: [],
  badges: {},          // { key: earnedAtISO }
  doctorReports: [],
  customSpecies: [],
  meta: { lastNotifyDay: null, dayOffset: 0, seenCelebrations: {} },
});

function migrate(db) {
  const base = emptyDB();
  const out = Object.assign(base, db || {});
  out.meta = Object.assign(emptyDB().meta, (db && db.meta) || {});
  out.schemaVersion = SCHEMA_VERSION;
  return out;
}

class Repository {
  constructor(adapter) { this.adapter = adapter; this.db = emptyDB(); this.listeners = new Set(); this.saveFailed = false; }
  async init() {
    let data = null;
    try { data = await this.adapter.load(); }
    catch (e) { this.adapter = new MemoryAdapter(); }
    this.db = migrate(data);
    return this;
  }
  get persistent() { return this.adapter.persistent && !this.saveFailed; }
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  async commit() {
    try { await this.adapter.save(this.db); this.saveFailed = false; }
    catch (e) { this.saveFailed = true; }
    this.listeners.forEach(fn => fn());
  }
  // ---- generic collection helpers ----
  all(coll) { return this.db[coll]; }
  byId(coll, id) { return this.db[coll].find(x => x.id === id) || null; }
  insert(coll, obj) { this.db[coll].push(obj); return obj; }
  update(coll, id, patch) { const o = this.byId(coll, id); if (o) Object.assign(o, patch); return o; }
  remove(coll, pred) { this.db[coll] = this.db[coll].filter(x => !pred(x)); }
  async reset() { this.db = emptyDB(); try { await this.adapter.clear(); } catch (e) {} this.listeners.forEach(fn => fn()); }
  exportJSON() { return JSON.stringify(this.db); }
  async importJSON(str) {
    const data = JSON.parse(str);
    if (!data || typeof data !== 'object' || !('plants' in data)) throw new Error('invalid');
    this.db = migrate(data); await this.commit();
  }
}

/** PhotoStore — เก็บรูป (dataURL ย่อขนาดแล้ว) ใน IndexedDB, fallback เป็นหน่วยความจำ */
const PhotoStore = (() => {
  const mem = new Map();
  const cache = new Map();
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve) => {
      try {
        const req = indexedDB.open('suan-photos', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('photos');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const t = db.transaction('photos', mode);
        const r = fn(t.objectStore('photos'));
        t.oncomplete = () => resolve(r && 'result' in r ? r.result : true);
        t.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  }
  return {
    async put(id, dataUrl) {
      cache.set(id, dataUrl);
      const ok = await tx('readwrite', s => s.put(dataUrl, id));
      if (!ok) mem.set(id, dataUrl);
    },
    async get(id) {
      if (cache.has(id)) return cache.get(id);
      if (mem.has(id)) return mem.get(id);
      const v = await tx('readonly', s => s.get(id));
      if (v) cache.set(id, v);
      return v || null;
    },
    async del(id) { cache.delete(id); mem.delete(id); await tx('readwrite', s => s.delete(id)); },
    async clear() { cache.clear(); mem.clear(); await tx('readwrite', s => s.clear()); },
  };
})();

/** ย่อรูปให้เล็กลงก่อนบันทึก (performance + พื้นที่เก็บ) */
function resizeImageFile(file, maxSide = 900, quality = 0.78) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('not-image'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const TaskEngine = {
  plantName(plant, sp) { return plant.nickname || (sp ? sp.nameTh.replace(/\s*\(.*\)/, '') : 'ต้นไม้'); },
  isMediumNotSoil(sp) { return sp && (sp.medium === 'orchid' || sp.medium === 'airy'); },

  dayN(plant, dk) { return plant.plantedDate ? U.diffDays(dk, plant.plantedDate) : null; },

  growthStage(plant, sp, dk) {
    const d = this.dayN(plant, dk);
    if (d == null || d < 0) return GROWTH_STAGES[0];
    if (plant.flowering) return GROWTH_STAGES[5];
    const fs = sp ? sp.floweringStartDay : 90;
    if (d >= fs) return GROWTH_STAGES[4];
    if (d >= 30) return GROWTH_STAGES[3];
    if (d >= 14) return GROWTH_STAGES[2];
    return GROWTH_STAGES[1];
  },
  journeyPhase(plant, sp, dk) {
    const d = this.dayN(plant, dk);
    if (d == null || d < 0) return 'prep';
    if (plant.flowering || (sp && d >= sp.floweringStartDay)) return 'bloom';
    if (d === 0) return 'plant';
    if (d <= 6) return 'd2_7';
    if (d <= 13) return 'w2';
    if (d <= 29) return 'w3_4';
    return 'grow';
  },

  soilInterval(plant, sp, d) {
    if (this.isMediumNotSoil(sp)) return 1;
    const type = plant.plantingType || 'pot';
    if (d <= 14) return 1;
    if (type === 'ground') return sp && sp.waterNeed === 'low' ? 3 : sp && sp.waterNeed === 'high' ? 1 : 2;
    return sp && sp.waterNeed === 'low' ? 2 : 1;
  },

  /** สร้าง Task object มาตรฐาน */
  make(plant, sp, key, type, dk, extra) {
    const pri = { PLANTING: 1, SOIL_CHECK: 1, PEST_CHECK: 2, DISEASE_CHECK: 2, FERTILIZER: 2, GENERAL: 2 }[type] || 3;
    return Object.assign({
      id: `${plant.id}|${key}`, userPlantId: plant.id, gardenId: plant.gardenId, type,
      dueDate: dk, completed: false, completedAt: null, recurrence: null, priority: pri,
      stage: this.growthStage(plant, sp, dk).key, source: 'engine', steps: [], description: '',
    }, extra);
  },

  /** งานประจำของต้นนี้ ณ วันที่ dk */
  recurring(plant, sp, dk) {
    const d = this.dayN(plant, dk);
    if (d == null || d < 1) return [];
    if (dk < U.isoToKey(plant.createdAt)) return [];
    const n = this.plantName(plant, sp);
    const out = [];
    const mk = (key, type, extra) => out.push(this.make(plant, sp, `${key}|${dk}`, type, dk, extra));
    const medium = this.isMediumNotSoil(sp);

    const si = this.soilInterval(plant, sp, d);
    if (d % si === 0) {
      mk('soil', 'SOIL_CHECK', {
        title: `${medium ? 'ตรวจวัสดุปลูก' : 'ตรวจดิน'}${n}`,
        description: 'ตรวจก่อนรดน้ำทุกครั้ง ไม่ต้องรดตามตาราง',
        steps: medium
          ? ['ใช้นิ้วแตะวัสดุปลูก (กาบมะพร้าว/ถ่าน) ด้านใน', 'สังเกตว่าแห้ง ชื้น หรือแฉะ', 'เลือกผลด้านล่าง']
          : ['ใช้นิ้วจิ้มดินลึกประมาณ 2–3 ซม.', 'สังเกตความชื้นที่ติดนิ้ว', 'เลือกผลด้านล่าง'],
        recurrence: si === 1 ? 'ทุกวัน' : `ทุก ${si} วัน`,
      });
    }
    if ((d <= 7 && d % 2 === 1) || (d > 7 && d % 7 === 3)) {
      mk('leaf', 'DISEASE_CHECK', {
        title: `ตรวจใบ${n}`, description: 'ดูสีใบและจุดผิดปกติ ใช้เวลาไม่ถึง 1 นาที',
        steps: ['ดูใบบนและใบล่างว่าเขียวดีไหม', 'ดูว่ามีจุด ใบเหลือง หรือใบไหม้ไหม', 'ถ้าเจออะไรแปลก ๆ กด "พบปัญหา"'],
        recurrence: d <= 7 ? 'ทุก 2 วัน' : 'สัปดาห์ละครั้ง',
      });
    }
    if ((d <= 7 && d % 3 === 2) || (d > 7 && d % 4 === 2)) {
      mk('pest', 'PEST_CHECK', {
        title: `ตรวจแมลง${n}`, description: 'แมลงชอบซ่อนใต้ใบและที่ยอดอ่อน',
        steps: ['พลิกดูใต้ใบ 3–4 ใบ', 'ดูยอดอ่อนและดอกตูม', 'สังเกตปุยขาว ตัวเล็ก ๆ หรือรอยแหว่ง'],
        recurrence: d <= 7 ? 'ทุก 3 วัน' : 'ทุก 4 วัน',
      });
    }
    const type = plant.plantingType || 'pot';
    if (type !== 'pot' && d >= 7 && d % 7 === 0) {
      mk('weed', 'WEEDING', {
        title: `ถอนวัชพืชรอบ${n}`, description: 'หญ้ารอบโคนแย่งน้ำและอาหาร',
        steps: ['ถอนหญ้าในรัศมีประมาณ 1 ฝ่ามือรอบโคน', 'ถอนให้ติดราก', 'ระวังอย่าดึงโดนรากต้นไม้ของเรา'],
        recurrence: 'สัปดาห์ละครั้ง',
      });
    }
    if (sp && d >= sp.fertStartDay && (d - sp.fertStartDay) % sp.fertIntervalDays === 0) {
      mk('fert', 'FERTILIZER', {
        title: `ถึงรอบปุ๋ย${n}`, description: 'ใช้ตามอัตราบนฉลากผลิตภัณฑ์เท่านั้น',
        steps: ['อ่านอัตราการใช้บนฉลากปุ๋ย', 'รดน้ำให้ดินชื้นก่อนใส่ปุ๋ย', 'ใส่ห่างจากโคนต้นเล็กน้อย ไม่กองติดลำต้น', 'บันทึกการใส่ปุ๋ยด้านล่าง'],
        recurrence: `ทุก ${sp.fertIntervalDays} วัน (โดยประมาณ)`,
      });
    }
    (sp && sp.pruneTasks || []).forEach((p, i) => {
      if (p.every && d >= p.day && (d - p.day) % p.every === 0) {
        mk('prune' + i, 'PRUNING', {
          title: `${p.title} (${n})`, description: sp.pruningNotes,
          steps: ['ใช้กรรไกรคมและสะอาด', 'ตัดกิ่งแห้ง กิ่งเสียก่อน', 'ตัดเหนือข้อหรือตาใบประมาณ 0.5–1 ซม.'],
          recurrence: `ทุก ${p.every} วัน (ถ้าจำเป็น)`,
        });
      }
    });
    if (plant.flowering && sp && sp.deadhead && d % 7 === 5) {
      mk('deadhead', 'PRUNING', {
        title: `เด็ดดอกที่โรย (${n})`, description: 'ช่วยให้ต้นออกดอกใหม่ต่อเนื่อง',
        steps: ['หาดอกที่เหี่ยวหรือแห้ง', 'เด็ดหรือตัดใต้ดอกลงมาถึงใบคู่แรก', 'ทิ้งดอกโรยให้ห่างต้น'], recurrence: 'สัปดาห์ละครั้ง',
      });
    }
    const stage = this.growthStage(plant, sp, dk).key;
    if ((stage === 'budding' || stage === 'flowering') && d % 7 === 4) {
      mk('bud', 'GENERAL', {
        title: stage === 'flowering' ? `ดูแลช่วงออกดอก (${n})` : `ตรวจตาดอก${n}`,
        description: 'ระยะออกดอกขึ้นกับพันธุ์และสภาพแวดล้อม ไม่มีวันที่แน่นอน',
        steps: ['ดูปลายกิ่งว่ามีตาดอกเล็ก ๆ ไหม', 'ตรวจแมลงที่ดอกตูม', 'อย่าย้ายต้นบ่อยช่วงนี้ ดอกตูมอาจร่วง'],
        recurrence: 'สัปดาห์ละครั้ง',
      });
    }
    if (d === 7 || d === 14 || d === 30 || (d > 30 && d % 30 === 0)) {
      mk('photo', 'PHOTO', {
        title: `ถ่ายรูป${n} (วันที่ ${d})`, description: 'ถ่ายมุมเดิมทุกครั้ง จะเห็นการเติบโตชัดเจน',
        steps: ['ถ่ายจากมุมเดิมกับครั้งก่อน', 'ถ่ายให้เห็นทั้งต้น', 'อัปโหลดรูปด้านล่าง'],
      });
    }
    return out;
  },

  /** งานครั้งเดียวของต้นนี้ (ไม่ขึ้นกับวันที่ดู) */
  oneTime(plant, sp) {
    const n = this.plantName(plant, sp);
    const created = U.isoToKey(plant.createdAt);
    const out = [];
    if (!plant.plantedDate) {
      const due = plant.plannedDate || created;
      const orchid = sp && sp.medium === 'orchid';
      out.push(this.make(plant, sp, 'plant', 'PLANTING', due, {
        title: `ปลูก${n}`, description: 'ทำทีละขั้น ติ๊กให้ครบแล้วกดเสร็จ',
        steps: orchid
          ? ['เตรียมกระถางหรือกระเช้าสำหรับกล้วยไม้', 'ใส่กาบมะพร้าวหรือถ่าน', 'วางต้นให้โคนไม่จมวัสดุปลูก', 'ใช้ลวดหรือไม้หลักยึดต้นให้แน่น', 'รดน้ำให้ชุ่ม']
          : ['เตรียมหลุมหรือกระถาง (กระถางต้องมีรูระบายน้ำ)', 'ใส่ดินผสมหรือวัสดุปลูก', 'ค่อย ๆ ถอดต้นออกจากถุง ระวังรากแตก', 'วางต้นให้โคนอยู่ระดับเดียวกับผิวดิน', 'กลบดินและกดเบา ๆ รอบโคน', 'รดน้ำครั้งแรกให้ชุ่ม'],
        checklist: true,
      }));
      return out;
    }
    const pd = plant.plantedDate;
    const at = (day) => U.addDays(pd, day);
    const keep = (due) => due >= created;
    out.push(this.make(plant, sp, 'photo0', 'PHOTO', pd < created ? created : pd, {
      title: `ถ่ายรูป${n}วันแรก`, description: 'รูปแรกจะใช้เทียบการเติบโตภายหลัง',
      steps: ['ถ่ายให้เห็นทั้งต้น', 'จำมุมที่ถ่ายไว้ ครั้งหน้าถ่ายมุมเดิม', 'อัปโหลดรูปด้านล่าง'],
    }));
    if (keep(at(10))) out.push(this.make(plant, sp, 'drain', 'GENERAL', at(10), {
      title: `ตรวจการระบายน้ำ (${n})`, description: 'น้ำขังเป็นสาเหตุอันดับต้น ๆ ที่ทำให้ต้นไม้ตาย',
      steps: ['หลังรดน้ำ สังเกตว่าน้ำไหลออกก้นกระถางภายในไม่กี่นาที', 'ถ้าปลูกลงดิน ดูว่ามีน้ำขังรอบโคนนานไหม', 'ถ้าขัง เทน้ำในจานรองทิ้ง หรือพูนดินโคนต้นให้สูงขึ้น'],
    }));
    if (keep(at(14))) out.push(this.make(plant, sp, 'growth14', 'GENERAL', at(14), {
      title: `ตรวจการเติบโต (${n})`, description: 'ครบ 2 สัปดาห์แล้ว ดูว่ามียอดหรือใบใหม่ไหม',
      steps: ['ดูว่ามีใบอ่อนหรือยอดใหม่', 'เทียบกับรูปวันแรก', 'ถ้าต้นดูไม่โต ลองใช้ "ช่วยฉัน"'],
    }));
    if (keep(at(28))) out.push(this.make(plant, sp, 'shape28', 'GENERAL', at(28), {
      title: `ตรวจทรงพุ่ม (${n})`, description: 'ดูว่าต้นแตกกิ่งสวย หรือยืดยาวเกินไป',
      steps: ['ดูว่ากิ่งแตกออกรอบต้นหรือยืดไปด้านเดียว', 'ถ้ายืดไปทางเดียว อาจได้แดดด้านเดียว ลองหมุนกระถาง', 'ถ้ายาวเกะกะ จดไว้ตัดแต่งรอบหน้า'],
    }));
    (sp && sp.pruneTasks || []).forEach((p, i) => {
      if (!p.every && keep(at(p.day))) out.push(this.make(plant, sp, 'pruneOnce' + i, 'PRUNING', at(p.day), {
        title: `${p.title} (${n})`, description: sp.pruningNotes,
        steps: ['ใช้มือหรือกรรไกรสะอาด', 'เด็ดปลายยอดออกประมาณ 1–2 ซม. เหนือข้อใบ', 'ต้นจะแตกกิ่งข้างภายใน 1–2 สัปดาห์'],
      }));
    });
    if (plant.flowering && plant.floweringSince) out.push(this.make(plant, sp, 'bloomPhoto', 'PHOTO', plant.floweringSince, {
      title: `ถ่ายรูปดอกแรกของ${n} 🌸`, description: 'เก็บความภูมิใจไว้ในไทม์ไลน์', steps: ['ถ่ายดอกใกล้ ๆ 1 รูป', 'ถ่ายทั้งต้นอีก 1 รูป'],
    }));
    return out;
  },
};

const Garden = {
  repo: null,
  init(repo) { this.repo = repo; },
  get db() { return this.repo.db; },
  save() { return this.repo.commit(); },

  // ---------- Species ----------
  species() { return PLANT_SPECIES.concat(this.db.customSpecies); },
  speciesById(id) { return this.species().find(s => s.id === id) || null; },
  addCustomSpecies(nameTh) {
    const name = String(nameTh || '').trim();
    if (!name) throw new Error('กรุณาใส่ชื่อต้นไม้');
    const existing = this.species().find(s => s.nameTh === name);
    if (existing) return existing;
    const sp = makeCustomSpecies(name);
    this.db.customSpecies.push(sp);
    return sp;
  },

  // ---------- Onboarding ----------
  /** @param f {name, experience, province, gardenName, gardenType, sunlight, speciesIds[], plantedStatus:'notyet'|'today'|'before', plantedDate} */
  async completeOnboarding(f) {
    const now = U.nowISO();
    const user = { id: U.uid('usr'), name: (f.name || '').trim() || 'เพื่อนนักปลูก', province: f.province || DEFAULT_PROVINCE, gardenType: f.gardenType, sunlight: f.sunlight, experienceLevel: f.experience || 'beginner', createdAt: now };
    this.db.user = user;
    const garden = this.addGarden({ name: f.gardenName || 'สวนหลังบ้าน', location: user.province, gardenType: f.gardenType, sunlight: f.sunlight, soilType: '', notes: '' }, false);
    const planted = f.plantedStatus === 'today' ? U.todayKey() : f.plantedStatus === 'before' ? f.plantedDate : null;
    f.speciesIds.forEach(sid => this.addPlant({ gardenId: garden.id, speciesId: sid, plantedDate: planted, plantingType: f.gardenType }, false));
    if (!planted) this.createGardenPrepTasks(garden);
    await this.save();
    return garden;
  },

  createGardenPrepTasks(garden) {
    const due = U.todayKey();
    const defs = [
      ['spot', 'GENERAL', 'เลือกพื้นที่ปลูก', 'เลือกที่ที่แดดถึง น้ำไม่ขัง และเดินไปดูได้ทุกวัน', ['เดินดูรอบบ้าน หาที่ที่ไม่มีน้ำขังเวลาฝนตก', 'ควรอยู่ใกล้ก๊อกน้ำหรือสายยาง', 'ถ้าปลูกกระถาง เลือกที่วางที่มั่นคง']],
      ['sun', 'SUNLIGHT', 'ตรวจแสงแดด', 'นับว่าตรงนั้นมีแดดส่องกี่ชั่วโมง', ['ดูตอน 9 โมง เที่ยง และบ่าย 3', 'นับชั่วโมงที่มีแดดส่องตรง', 'ไม้ดอกส่วนใหญ่ชอบแดด 6 ชั่วโมงขึ้นไป']],
      ['soil', 'GENERAL', 'เตรียมดิน', 'ดินร่วน ระบายน้ำดี รากเดินง่าย', ['ถ้าปลูกกระถาง: ใช้ดินผสมพร้อมปลูก', 'ถ้าปลูกลงดิน: ขุดดิน เก็บหินและรากหญ้าออก', 'ผสมปุ๋ยหมักกับดินเพื่อให้ดินร่วน']],
      ['prep', 'GENERAL', 'เตรียมต้นไม้และอุปกรณ์', 'เตรียมให้พร้อมก่อนลงมือปลูก', ['ต้นไม้ (เลือกต้นที่ใบเขียว ไม่มีแมลง)', 'กระถางที่มีรูระบายน้ำ (ถ้าปลูกกระถาง)', 'ช้อนปลูกหรือเสียม ถุงมือ', 'บัวรดน้ำหรือสายยาง']],
    ];
    defs.forEach(([k, type, title, description, steps]) => {
      this.db.tasks.push({ id: `${garden.id}|prep-${k}`, userPlantId: null, gardenId: garden.id, type, title, description, steps, dueDate: due, completed: false, completedAt: null, recurrence: null, priority: 1, stage: 'prep', source: 'custom', firstDay: true });
    });
  },

  // ---------- Garden ----------
  gardens() { return this.db.gardens; },
  addGarden(g, commit = true) {
    const name = String(g.name || '').trim();
    if (!name) throw new Error('กรุณาใส่ชื่อสวน');
    const garden = { id: U.uid('gdn'), userId: this.db.user && this.db.user.id, name, location: g.location || DEFAULT_PROVINCE, gardenType: g.gardenType || 'pot', sunlight: g.sunlight || 'unsure', soilType: g.soilType || '', notes: g.notes || '', createdAt: U.nowISO() };
    this.db.gardens.push(garden);
    if (commit) this.save();
    return garden;
  },
  updateGarden(id, patch) {
    if ('name' in patch && !String(patch.name).trim()) throw new Error('กรุณาใส่ชื่อสวน');
    this.repo.update('gardens', id, patch); return this.save();
  },
  deleteGarden(id) {
    if (this.db.gardens.length <= 1) throw new Error('ต้องมีสวนอย่างน้อย 1 สวน');
    this.plants().filter(p => p.gardenId === id).forEach(p => this.deletePlant(p.id, false));
    this.repo.remove('gardens', g => g.id === id);
    this.repo.remove('tasks', t => t.gardenId === id);
    return this.save();
  },

  // ---------- Plants ----------
  plants() { return this.db.plants; },
  plant(id) { return this.repo.byId('plants', id); },
  validatePlant(d) {
    const errors = {};
    if (!d.speciesId || !this.speciesById(d.speciesId)) errors.speciesId = 'กรุณาเลือกชนิดต้นไม้';
    if (!d.gardenId || !this.repo.byId('gardens', d.gardenId)) errors.gardenId = 'กรุณาเลือกสวน';
    if (d.plantedDate) {
      if (!U.isValidKey(d.plantedDate)) errors.plantedDate = 'วันที่ไม่ถูกต้อง';
      else if (d.plantedDate > U.todayKey()) errors.plantedDate = 'วันที่ปลูกต้องไม่เกินวันนี้ ถ้ายังไม่ได้ปลูก เลือก "ยังไม่ได้ปลูก"';
      else if (U.diffDays(U.todayKey(), d.plantedDate) > 3650) errors.plantedDate = 'วันที่เก่าเกินไป ลองตรวจสอบปีอีกครั้ง (ใช้ปี ค.ศ. ในปฏิทิน)';
    }
    if (d.plannedDate && !U.isValidKey(d.plannedDate)) errors.plannedDate = 'วันที่ไม่ถูกต้อง';
    if (d.quantity != null && d.quantity !== '') {
      const q = Number(d.quantity);
      if (!Number.isInteger(q) || q < 1 || q > 999) errors.quantity = 'จำนวนต้นต้องเป็นตัวเลข 1–999';
    }
    if (d.nickname && d.nickname.length > 40) errors.nickname = 'ชื่อเล่นยาวได้ไม่เกิน 40 ตัวอักษร';
    return errors;
  },
  addPlant(d, commit = true) {
    const errors = this.validatePlant(d);
    if (Object.keys(errors).length) { const e = new Error('validation'); e.fields = errors; throw e; }
    const garden = this.repo.byId('gardens', d.gardenId);
    const p = {
      id: U.uid('plt'), gardenId: d.gardenId, speciesId: d.speciesId, nickname: (d.nickname || '').trim(),
      plantedDate: d.plantedDate || null, plannedDate: d.plantedDate ? null : (d.plannedDate || null),
      location: (d.location || '').trim(), plantingType: d.plantingType || garden.gardenType || 'pot', potSize: d.potSize || '',
      quantity: d.quantity ? Number(d.quantity) : 1, notes: (d.notes || '').trim(), status: 'normal',
      flowering: false, floweringSince: null, coverPhotoId: null, createdAt: U.nowISO(),
    };
    this.db.plants.push(p);
    if (commit) this.save();
    return p;
  },
  updatePlant(id, d) {
    const cur = this.plant(id);
    const merged = Object.assign({}, cur, d);
    const errors = this.validatePlant(merged);
    if (Object.keys(errors).length) { const e = new Error('validation'); e.fields = errors; throw e; }
    Object.assign(cur, {
      gardenId: merged.gardenId, speciesId: merged.speciesId, nickname: (merged.nickname || '').trim(),
      plantedDate: merged.plantedDate || null, plannedDate: merged.plantedDate ? null : (merged.plannedDate || null),
      location: (merged.location || '').trim(), plantingType: merged.plantingType, potSize: merged.potSize || '',
      quantity: merged.quantity ? Number(merged.quantity) : 1, notes: (merged.notes || '').trim(),
    });
    return this.save();
  },
  deletePlant(id, commit = true) {
    const photos = this.db.photoLogs.filter(x => x.userPlantId === id);
    photos.forEach(ph => PhotoStore.del(ph.id));
    ['waterLogs', 'fertilizerLogs', 'photoLogs', 'doctorReports'].forEach(c => this.repo.remove(c, x => x.userPlantId === id));
    this.repo.remove('tasks', t => t.userPlantId === id);
    Object.keys(this.db.taskState).forEach(k => { if (k.startsWith(id + '|')) delete this.db.taskState[k]; });
    this.repo.remove('plants', p => p.id === id);
    if (commit) return this.save();
  },
  plantName(p) { return TaskEngine.plantName(p, this.speciesById(p.speciesId)); },
  ageDays(p) { return p.plantedDate ? Math.max(0, U.diffDays(U.todayKey(), p.plantedDate)) : null; },
  async markFlowering(id, on) {
    const p = this.plant(id);
    p.flowering = !!on; p.floweringSince = on ? U.todayKey() : null;
    if (on && p.status === 'problem') p.status = 'normal';
    await this.save();
  },
  async setProblem(id, on, note) {
    const p = this.plant(id); p.status = on ? 'problem' : 'normal';
    if (on && note) p.problemNote = note; if (!on) p.problemNote = '';
    await this.save();
  },

  plantStatus(p, todayTasks) {
    if (!p.plantedDate) return 'planning';
    if (p.status === 'problem') return 'problem';
    const tt = (todayTasks || this.todayTasks()).filter(t => t.userPlantId === p.id && !t.completed);
    if (tt.length) return 'needs_care';
    if (p.flowering) return 'flowering';
    return 'normal';
  },

  // ---------- Tasks ----------
  withState(t) {
    if (t.source === 'engine') {
      const s = this.db.taskState[t.id];
      if (s) Object.assign(t, { completed: !!s.completed, completedAt: s.completedAt, result: s.result });
    }
    return t;
  },
  engineTasksFor(p) { return { sp: this.speciesById(p.speciesId) }; },
  tasksForDate(dk) {
    const out = [];
    this.plants().forEach(p => {
      const sp = this.speciesById(p.speciesId);
      TaskEngine.recurring(p, sp, dk).forEach(t => out.push(this.withState(t)));
      TaskEngine.oneTime(p, sp).filter(t => t.dueDate === dk).forEach(t => out.push(this.withState(t)));
    });
    this.db.tasks.filter(t => t.dueDate === dk).forEach(t => out.push(Object.assign({}, t)));
    return this.sortTasks(out);
  },
  todayTasks() {
    const today = U.todayKey();
    const out = this.tasksForDate(today);
    const seen = new Set(out.map(t => t.id));
    this.plants().forEach(p => {
      const sp = this.speciesById(p.speciesId);
      TaskEngine.oneTime(p, sp).filter(t => t.dueDate < today).map(t => this.withState(t))
        .filter(t => !t.completed && !seen.has(t.id)).forEach(t => { t.overdue = true; out.push(t); });
    });
    this.db.tasks.filter(t => t.dueDate < today && !t.completed && !seen.has(t.id))
      .forEach(t => out.push(Object.assign({}, t, { overdue: true })));
    return this.sortTasks(out);
  },
  sortTasks(list) {
    return list.sort((a, b) => (a.completed - b.completed) || ((a.firstDay ? 0 : 1) - (b.firstDay ? 0 : 1)) || (a.priority - b.priority) || a.title.localeCompare(b.title, 'th'));
  },
  findTask(id) {
    const custom = this.db.tasks.find(t => t.id === id);
    if (custom) return Object.assign({}, custom);
    const [pid] = id.split('|');
    const p = this.plant(pid);
    if (!p) return null;
    const sp = this.speciesById(p.speciesId);
    const parts = id.split('|');
    if (parts.length >= 3) {
      const dk = parts[parts.length - 1];
      return TaskEngine.recurring(p, sp, dk).map(t => this.withState(t)).find(t => t.id === id) || null;
    }
    return TaskEngine.oneTime(p, sp).map(t => this.withState(t)).find(t => t.id === id) || null;
  },
  async completeTask(id, result = {}) {
    const t = this.findTask(id);
    if (!t) throw new Error('ไม่พบงานนี้');
    const at = U.nowISO();
    if (t.source === 'custom') this.repo.update('tasks', id, { completed: true, completedAt: at, result });
    else this.db.taskState[id] = { completed: true, completedAt: at, result };
    let planted = false;
    if (t.type === 'PLANTING' && t.userPlantId) {
      const p = this.plant(t.userPlantId);
      if (p && !p.plantedDate) { p.plantedDate = U.todayKey(); p.plannedDate = null; planted = true; }
    }
    await this.save();
    const newBadges = await this.checkBadges();
    return { task: t, planted, newBadges };
  },
  async uncompleteTask(id) {
    const t = this.findTask(id);
    if (!t) return;
    if (t.source === 'custom') this.repo.update('tasks', id, { completed: false, completedAt: null });
    else delete this.db.taskState[id];
    await this.save();
  },
  async addCustomTask({ title, dueDate, userPlantId, description, type = 'GENERAL' }) {
    const errors = {};
    if (!String(title || '').trim()) errors.title = 'กรุณาใส่ชื่องาน';
    if (!U.isValidKey(dueDate)) errors.dueDate = 'วันที่ไม่ถูกต้อง';
    if (Object.keys(errors).length) { const e = new Error('validation'); e.fields = errors; throw e; }
    const p = userPlantId ? this.plant(userPlantId) : null;
    const t = { id: U.uid('tsk'), userPlantId: p ? p.id : null, gardenId: p ? p.gardenId : (this.db.gardens[0] || {}).id, type, title: title.trim(), description: (description || '').trim(), steps: [], dueDate, completed: false, completedAt: null, recurrence: null, priority: 2, stage: p ? TaskEngine.growthStage(p, this.speciesById(p.speciesId), dueDate).key : 'general', source: 'custom' };
    this.db.tasks.push(t);
    await this.save();
    return t;
  },
  async deleteCustomTask(id) { this.repo.remove('tasks', t => t.id === id); await this.save(); },

  firstDayProgress() {
    const prep = this.todayTasks().filter(t => t.firstDay || t.type === 'PLANTING');
    const all = this.db.tasks.filter(t => t.firstDay);
    const plantingAll = this.plants().map(p => ({ p, done: !!p.plantedDate }));
    const total = all.length + plantingAll.length;
    const done = all.filter(t => t.completed).length + plantingAll.filter(x => x.done).length;
    const active = all.some(t => !t.completed) || plantingAll.some(x => !x.done);
    return { total, done, active, hasPrep: all.length > 0, list: prep };
  },

  // ---------- Water ----------
  async logWater(plantId, { soilCondition, watered, note = '', amount = '' }) {
    if (!SOIL_RESULT[soilCondition]) throw new Error('กรุณาเลือกสภาพดิน');
    const log = { id: U.uid('wtr'), userPlantId: plantId, checkedAt: U.nowISO(), soilCondition, watered: !!watered, amount, note: String(note).trim() };
    this.db.waterLogs.push(log);
    await this.save();
    await this.checkOverwatering(plantId);
    return log;
  },
  waterLogs(plantId) { return this.db.waterLogs.filter(l => l.userPlantId === plantId).sort((a, b) => b.checkedAt.localeCompare(a.checkedAt)); },
  overwaterWarning(plantId) {
    const p = this.plant(plantId); if (!p) return null;
    const sp = this.speciesById(p.speciesId);
    const since = U.addDays(U.todayKey(), -2);
    const recent = this.waterLogs(plantId).filter(l => U.isoToKey(l.checkedAt) >= since);
    const wateredCount = recent.filter(l => l.watered).length;
    const wateredWhenWet = recent.some(l => l.watered && (l.soilCondition === 'wet' || l.soilCondition === 'moist'));
    const limit = (sp && sp.waterNeed === 'low') || p.plantingType === 'ground' ? 3 : 4;
    if (wateredWhenWet) return 'มีการรดน้ำตอนที่ดินยังชื้นหรือแฉะ ลองตรวจความชื้นดินก่อนรดครั้งต่อไป';
    if (wateredCount >= limit) return `ช่วง 3 วันนี้รดน้ำไป ${wateredCount} ครั้ง ถี่กว่าปกติ ลองตรวจความชื้นดินก่อนรดครั้งต่อไป`;
    return null;
  },
  async checkOverwatering(plantId) {
    const msg = this.overwaterWarning(plantId);
    if (msg) {
      const p = this.plant(plantId);
      await ServiceRegistry.notifications.notify({ type: 'warning', title: `⚠️ ${this.plantName(p)}: รดน้ำถี่กว่าปกติ`, body: msg, plantId, dedupeKey: `over:${plantId}:${U.todayKey()}` });
      await this.save();
    }
  },

  // ---------- Fertilizer ----------
  validateNPK(s) { return !s || /^\d{1,2}-\d{1,2}-\d{1,2}$/.test(String(s).trim()); },
  async addFertilizer(f) {
    const errors = {};
    if (!String(f.name || '').trim()) errors.name = 'กรุณาใส่ชื่อปุ๋ย';
    if (!f.npkUnknown && !this.validateNPK(f.npk)) errors.npk = 'รูปแบบสูตรควรเป็นตัวเลข เช่น 15-15-15 หรือเลือก "ไม่ทราบ"';
    if (f.startDate && !U.isValidKey(f.startDate)) errors.startDate = 'วันที่ไม่ถูกต้อง';
    if (Object.keys(errors).length) { const e = new Error('validation'); e.fields = errors; throw e; }
    const item = { id: U.uid('fz'), name: f.name.trim(), npk: f.npkUnknown ? '' : String(f.npk || '').trim(), type: f.type || 'unknown', labelRate: String(f.labelRate || '').trim(), startDate: f.startDate || U.todayKey(), createdAt: U.nowISO() };
    this.db.fertilizers.push(item);
    await this.save();
    return item;
  },
  async deleteFertilizer(id) { this.repo.remove('fertilizers', f => f.id === id); await this.save(); },
  async logFertilizer(plantId, { fertilizerId, fertilizerName, appliedAt, amount, note }) {
    const errors = {};
    const fz = fertilizerId ? this.repo.byId('fertilizers', fertilizerId) : null;
    const name = fz ? fz.name : String(fertilizerName || '').trim();
    if (!name) errors.fertilizerName = 'กรุณาเลือกหรือใส่ชื่อปุ๋ย (ถ้าไม่ทราบ พิมพ์ว่า "ไม่ทราบชื่อ")';
    const d = appliedAt || U.todayKey();
    if (!U.isValidKey(d)) errors.appliedAt = 'วันที่ไม่ถูกต้อง';
    else if (d > U.todayKey()) errors.appliedAt = 'วันที่ใส่ปุ๋ยต้องไม่เกินวันนี้';
    if (Object.keys(errors).length) { const e = new Error('validation'); e.fields = errors; throw e; }
    const log = { id: U.uid('fzl'), userPlantId: plantId, fertilizerId: fz ? fz.id : null, fertilizerName: name, appliedAt: d, amount: String(amount || '').trim(), note: String(note || '').trim(), createdAt: U.nowISO() };
    this.db.fertilizerLogs.push(log);
    await this.save();
    return log;
  },
  fertilizerLogs(plantId) { return this.db.fertilizerLogs.filter(l => l.userPlantId === plantId).sort((a, b) => b.appliedAt.localeCompare(a.appliedAt)); },
  lastFertilizer(plantId) { return this.fertilizerLogs(plantId)[0] || null; },
  nextFertilizerDate(p) {
    const sp = this.speciesById(p.speciesId);
    if (!p.plantedDate || !sp) return null;
    const d = U.diffDays(U.todayKey(), p.plantedDate);
    if (d < sp.fertStartDay) return U.addDays(p.plantedDate, sp.fertStartDay);
    const k = Math.ceil((d - sp.fertStartDay) / sp.fertIntervalDays);
    return U.addDays(p.plantedDate, sp.fertStartDay + k * sp.fertIntervalDays);
  },

  // ---------- Photos ----------
  async addPhoto(plantId, file, note = '') {
    const dataUrl = await resizeImageFile(file);
    const id = U.uid('pht');
    await PhotoStore.put(id, dataUrl);
    const log = { id, userPlantId: plantId, imageUrl: 'idb:' + id, capturedAt: U.nowISO(), note: String(note).trim() };
    this.db.photoLogs.push(log);
    const p = this.plant(plantId); if (p) p.coverPhotoId = id;
    await this.save();
    return log;
  },
  async deletePhoto(id) {
    const ph = this.repo.byId('photoLogs', id); if (!ph) return;
    await PhotoStore.del(id);
    this.repo.remove('photoLogs', x => x.id === id);
    const p = this.plant(ph.userPlantId);
    if (p && p.coverPhotoId === id) { const rest = this.photos(p.id); p.coverPhotoId = rest.length ? rest[rest.length - 1].id : null; }
    await this.save();
  },
  photos(plantId) { return this.db.photoLogs.filter(x => x.userPlantId === plantId).sort((a, b) => a.capturedAt.localeCompare(b.capturedAt)); },

  // ---------- Doctor ----------
  async saveDoctorReport(plantId, symptom, answers, result, makeFollowUp) {
    const rep = { id: U.uid('doc'), userPlantId: plantId, symptom, answers, causes: result.causes.map(c => c.title), createdAt: U.nowISO() };
    this.db.doctorReports.push(rep);
    const p = this.plant(plantId);
    const sym = DOCTOR_SYMPTOMS.find(s => s.key === symptom);
    if (p) { p.status = 'problem'; p.problemNote = sym ? sym.label : ''; }
    if (makeFollowUp && p) {
      this.db.tasks.push({ id: U.uid('tsk'), userPlantId: p.id, gardenId: p.gardenId, type: 'DISEASE_CHECK', title: `ติดตามอาการ${sym ? sym.label : ''} (${this.plantName(p)})`, description: 'ดูว่าอาการดีขึ้นหรือแย่ลง เทียบกับรูปครั้งก่อน', steps: ['ดูจุดที่มีอาการเดิม', 'ถ่ายรูปเทียบ', 'ถ้าดีขึ้น กด "อาการดีขึ้นแล้ว" ในหน้าต้นไม้'], dueDate: U.addDays(U.todayKey(), 3), completed: false, completedAt: null, recurrence: null, priority: 1, stage: 'problem', source: 'custom' });
    }
    await this.save();
    return rep;
  },

  // ---------- History ----------
  history(plantId) {
    const items = [];
    this.waterLogs(plantId).forEach(l => items.push({ at: l.checkedAt, emoji: '💧', text: `ตรวจดิน: ${SOIL_RESULT[l.soilCondition].label}${l.watered ? ' · รดน้ำแล้ว' : ' · ไม่ได้รด'}`, note: l.note }));
    this.fertilizerLogs(plantId).forEach(l => items.push({ at: l.createdAt || l.appliedAt, date: l.appliedAt, emoji: '🧪', text: `ใส่ปุ๋ย: ${l.fertilizerName}${l.amount ? ' · ' + l.amount : ''}`, note: l.note }));
    this.photos(plantId).forEach(l => items.push({ at: l.capturedAt, emoji: '📷', text: 'ถ่ายรูปต้นไม้', note: l.note }));
    Object.entries(this.db.taskState).filter(([k, s]) => k.startsWith(plantId + '|') && s.completed).forEach(([k, s]) => {
      const t = this.findTask(k);
      if (t && !['SOIL_CHECK', 'FERTILIZER', 'PHOTO'].includes(t.type)) items.push({ at: s.completedAt, emoji: '✅', text: t.title });
    });
    this.db.tasks.filter(t => t.userPlantId === plantId && t.completed).forEach(t => items.push({ at: t.completedAt, emoji: '✅', text: t.title }));
    this.db.doctorReports.filter(r => r.userPlantId === plantId).forEach(r => {
      const s = DOCTOR_SYMPTOMS.find(x => x.key === r.symptom);
      items.push({ at: r.createdAt, emoji: '🆘', text: `บันทึกอาการ: ${s ? s.label : r.symptom}` });
    });
    return items.sort((a, b) => b.at.localeCompare(a.at));
  },

  // ---------- Progress / Gamification ----------
  careDays() { return this.db.user ? U.diffDays(U.todayKey(), U.isoToKey(this.db.user.createdAt)) + 1 : 0; },
  activeDays() {
    const days = new Set();
    Object.values(this.db.taskState).forEach(s => s.completed && s.completedAt && days.add(U.isoToKey(s.completedAt)));
    this.db.tasks.forEach(t => t.completed && t.completedAt && days.add(U.isoToKey(t.completedAt)));
    this.db.waterLogs.forEach(l => days.add(U.isoToKey(l.checkedAt)));
    return days.size;
  },
  gardenGrowth() {
    const ps = this.plants();
    if (!ps.length) return 0;
    const today = U.todayKey();
    const sum = ps.reduce((acc, p) => {
      const sp = this.speciesById(p.speciesId);
      const idx = GROWTH_STAGES.findIndex(s => s.key === TaskEngine.growthStage(p, sp, today).key);
      let frac = idx / 5;
      // ความคืบหน้าระหว่าง stage (ละเอียดขึ้น)
      const d = TaskEngine.dayN(p, today);
      if (d != null && idx >= 1 && idx < 4) { const fs = sp ? sp.floweringStartDay : 90; frac = Math.min(0.8, 0.2 + (d / fs) * 0.6); }
      return acc + frac;
    }, 0);
    return Math.round((sum / ps.length) * 100);
  },
  async checkBadges() {
    const b = this.db.badges, earned = [];
    const give = (k) => { if (!b[k]) { b[k] = U.nowISO(); earned.push(BADGES.find(x => x.key === k)); } };
    if (this.plants().some(p => p.plantedDate)) give('first_plant');
    const anyDone = Object.values(this.db.taskState).some(s => s.completed) || this.db.tasks.some(t => t.completed);
    if (anyDone) give('first_task');
    const ad = this.activeDays();
    if (ad >= 7) give('care7');
    if (ad >= 30) give('care30');
    if (this.plants().some(p => p.flowering)) give('first_bloom');
    if (earned.length) {
      for (const e of earned) await ServiceRegistry.notifications.notify({ type: 'badge', title: `${e.emoji} ได้รับเหรียญ: ${e.label}`, body: e.desc, dedupeKey: 'badge:' + e.key });
      await this.save();
    }
    return earned;
  },

  // ---------- Notifications ----------
  async runDailyNotifications() {
    const today = U.todayKey();
    if (!this.db.user || this.db.meta.lastNotifyDay === today) return;
    const tasks = this.todayTasks().filter(t => !t.completed);
    const N = ServiceRegistry.notifications;
    if (tasks.length) await N.notify({ type: 'digest', title: `🌸 วันนี้มีงานดูแลสวน ${tasks.length} รายการ`, body: 'เปิดหน้า "วันนี้" เพื่อดูว่าต้องทำอะไรบ้าง', dedupeKey: 'digest:' + today });
    const soil = tasks.filter(t => t.type === 'SOIL_CHECK').slice(0, 3);
    for (const t of soil) await N.notify({ type: 'task', title: `🌱 ถึงเวลา${t.title}แล้ว`, body: 'ตรวจดินก่อนรดน้ำ ถ้าดินยังชื้นก็ยังไม่ต้องรด', taskId: t.id, dedupeKey: 'soil:' + t.id });
    this.db.meta.lastNotifyDay = today;
    await this.save();
  },
  unreadCount() { return this.db.notifications.filter(n => !n.read).length; },
  async markAllRead() { this.db.notifications.forEach(n => n.read = true); await this.save(); },

  // ---------- Settings ----------
  async updateUser(patch) {
    if ('name' in patch && !String(patch.name).trim()) throw new Error('กรุณาใส่ชื่อ');
    Object.assign(this.db.user, patch); await this.save();
  },
  sunlightMismatch(sp, sunV) {
    const o = SUN_OPTIONS.find(s => s.v === sunV);
    if (!sp || !o || o.hours == null || !sp.sunlight.minHours) return null;
    if (o.hours + 1 < sp.sunlight.minHours) return `${sp.nameTh} (${sp.sunlight.label}) อาจออกดอกน้อยถ้าได้แดดแค่ ${o.label}`;
    if (sp.sunlight.minHours <= 3 && o.hours >= 6) return `${sp.nameTh} (${sp.sunlight.label}) แดดจัดอาจทำให้ใบไหม้ ควรมีร่มเงาช่วงบ่าย`;
    return null;
  },
};

const ICON = {

  bell: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>',
  search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
