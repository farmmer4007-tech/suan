};

/* ---------- Plant illustration (no external images) ---------- */
const PlantArt = (() => {
  const C = 60, CY = 52;
  const ring = (n, rx, ry, dist, fill, rot = 0, extra = '') => Array.from({ length: n }, (_, i) =>
    `<ellipse cx="${C}" cy="${CY - dist}" rx="${rx}" ry="${ry}" fill="${fill}" ${extra} transform="rotate(${rot + i * 360 / n} ${C} ${CY})"/>`).join('');
  const stem = (leaf = '#5DAE7E') => `<path d="M60 118 C60 98 58 84 60 64" stroke="#4E9A6E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="46" cy="94" rx="13" ry="6" fill="${leaf}" transform="rotate(-30 46 94)"/><ellipse cx="74" cy="86" rx="13" ry="6" fill="${leaf}" transform="rotate(28 74 86)"/>`;
  function svg(sp) {
    const im = (sp && sp.image) || { kind: 'sprout', petal: '#7CC59A', center: '#4E9A6E', bg: '#E3F4E9' };
    const P = im.petal, Ce = im.center, st = im.stroke ? `stroke="${im.stroke}" stroke-width="1.5"` : '';
    let f = '';
    switch (im.kind) {
      case 'round5':
        f = im.small ? ring(5, 12, 15, 13, P, 0, st) + `<circle cx="60" cy="52" r="6" fill="${Ce}"/>`
          : ring(5, 17, 23, 19, P, 0, st) + `<circle cx="60" cy="52" r="7" fill="${Ce}"/><path d="M60 52 L72 30" stroke="${Ce}" stroke-width="3" stroke-linecap="round"/><circle cx="72" cy="29" r="3.5" fill="${Ce}"/>`;
        break;
      case 'bract': {
        const cl = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s}) translate(-60 -52)">${ring(3, 15, 21, 15, P, 0, 'fill-opacity=".95"')}<circle cx="60" cy="52" r="4" fill="${Ce}"/></g>`;
        f = cl(36, 66, .55) + cl(84, 64, .55) + cl(60, 52, 1);
        break;
      }
      case 'pom':
        f = ring(14, 8, 10, 22, P) + ring(11, 7, 9, 14, P, 12, 'fill-opacity=".9"') + `<circle cx="60" cy="52" r="10" fill="${Ce}"/>` + ring(6, 3, 5, 6, P, 0);
        break;
      case 'daisy':
        f = im.big ? ring(18, 6, 15, 27, P) + `<circle cx="60" cy="52" r="17" fill="${Ce}"/><circle cx="60" cy="52" r="11" fill="${Ce}" stroke="#4a2a12" stroke-dasharray="2 3" stroke-width="2"/>`
          : ring(14, 6, 15, 20, P) + (im.layers === 2 ? ring(12, 5, 11, 13, P, 15, 'fill-opacity=".85"') : '') + `<circle cx="60" cy="52" r="8" fill="${Ce}"/>`;
        break;
      case 'star':
        f = ring(6, 6, 16, 15, P, 0, st) + ring(6, 5, 12, 10, P, 30, st) + `<circle cx="60" cy="52" r="5" fill="${Ce}"/>`;
        break;
      case 'rose':
        f = ring(6, 14, 18, 16, P, 0, st) + ring(5, 11, 14, 10, P, 30, st) + ring(4, 7, 9, 5, P, 10, st) + `<circle cx="60" cy="52" r="4" fill="${Ce}"/>`;
        break;
      case 'cluster': {
        const pts = [[60, 36], [48, 42], [72, 42], [40, 54], [60, 50], [80, 54], [50, 62], [70, 62], [60, 66]];
        f = pts.map(([x, y]) => `<g transform="translate(${x - 60} ${y - 52})">${ring(4, 4, 7, 6, P)}<circle cx="60" cy="52" r="2" fill="${Ce}"/></g>`).join('');
        break;
      }
      case 'orchid':
        f = `<ellipse cx="60" cy="30" rx="8" ry="18" fill="${P}"/>
             <ellipse cx="60" cy="52" rx="24" ry="13" fill="${P}" transform="rotate(-25 60 52)" fill-opacity=".9"/>
             <ellipse cx="60" cy="52" rx="24" ry="13" fill="${P}" transform="rotate(25 60 52)" fill-opacity=".9"/>
             <ellipse cx="44" cy="66" rx="7" ry="15" fill="${P}" transform="rotate(35 44 66)"/><ellipse cx="76" cy="66" rx="7" ry="15" fill="${P}" transform="rotate(-35 76 66)"/>
             <path d="M50 58 Q60 82 70 58 Q60 64 50 58Z" fill="#7D3A9A"/><circle cx="60" cy="54" r="5" fill="${Ce}"/>`;
        break;
      case 'anthurium':
        f = `<path d="M60 76 C30 62 26 30 46 26 C54 24 58 30 60 36 C62 30 66 24 74 26 C94 30 90 62 60 76Z" fill="${P}"/>
             <path d="M60 76 C40 64 36 40 48 34" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none"/>
             <rect x="56" y="26" width="8" height="30" rx="4" fill="${Ce}" transform="rotate(18 60 50)"/>`;
        break;
      case 'begonia': {
        const fl = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s}) translate(-60 -52)"><ellipse cx="60" cy="38" rx="13" ry="14" fill="${P}"/><ellipse cx="60" cy="66" rx="13" ry="14" fill="${P}"/><ellipse cx="46" cy="52" rx="9" ry="8" fill="${P}" fill-opacity=".85"/><ellipse cx="74" cy="52" rx="9" ry="8" fill="${P}" fill-opacity=".85"/><circle cx="60" cy="52" r="6" fill="${Ce}"/></g>`;
        f = fl(44, 60, .6) + fl(66, 48, .85);
        break;
      }
      default:
        return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="${im.bg}"/>
          <path d="M60 110 V70" stroke="#4E9A6E" stroke-width="5" stroke-linecap="round"/>
          <path d="M60 74 C40 72 32 54 34 44 C48 44 60 56 60 74Z" fill="${P}"/><path d="M60 66 C76 64 88 48 86 36 C70 36 60 50 60 66Z" fill="${Ce}"/></svg>`;
    }
    return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="${im.bg}"/>${stem()}${f}</svg>`;
  }
  return { svg };
})();

const C = {
  /* ---------- AppHeader ---------- */
  AppHeader({ title, back = false, actions = true }) {
    const unread = Garden.unreadCount();
    return `<header class="header" id="appHeader"><div class="wrap header-in">
      ${back ? `<button class="icon-btn" data-act="back" aria-label="ย้อนกลับ">${ICON.back}</button><div class="header-title" role="heading" aria-level="1">${esc(title)}</div>`
        : `<div class="brand"><span class="brand-mark" aria-hidden="true">🌸</span><span>สวนของฉัน</span></div>`}
      ${actions ? `<button class="icon-btn" data-act="open-search" aria-label="ค้นหา">${ICON.search}</button>
      <button class="icon-btn" data-act="open-notifs" aria-label="การแจ้งเตือน${unread ? ` มี ${unread} รายการใหม่` : ''}">${ICON.bell}${unread ? `<span class="dot num">${unread > 9 ? '9+' : unread}</span>` : ''}</button>` : ''}
    </div></header>`;
  },

  /* ---------- BottomNavigation ---------- */
  BottomNavigation(active) {
    const items = [['today', '🏠', 'วันนี้'], ['plants', '🌱', 'ต้นไม้'], ['calendar', '📅', 'ปฏิทิน'], ['help', '🆘', 'ช่วยฉัน'], ['profile', '👤', 'สวนของฉัน']];
    return `<nav class="bnav" aria-label="เมนูหลัก"><div class="rail-brand"><span class="brand-mark" aria-hidden="true">🌸</span>สวนของฉัน</div><ul>
      ${items.map(([k, e, l]) => `<li><button data-act="tab" data-tab="${k}" ${active === k ? 'aria-current="page"' : ''}><span class="ico" aria-hidden="true">${e}</span><span>${l}</span></button></li>`).join('')}
    </ul></nav>`;
  },

  /* ---------- PlantStatusBadge ---------- */
  PlantStatusBadge(status) {
    const s = PLANT_STATUS[status] || PLANT_STATUS.normal;
    return `<span class="tag ${s.tone}"><span aria-hidden="true">${s.emoji}</span> ${s.label}</span>`;
  },

  ProgressBar(pct, { label = '', tone = '' } = {}) {
    const v = U.clamp(Math.round(pct), 0, 100);
    return `<div class="progress ${tone}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" aria-label="${esc(label)}"><span style="width:${v}%"></span></div>`;
  },

  Thumb(plant, sp) {
    if (plant && plant.coverPhotoId) return `<div class="pthumb"><img data-photo="${esc(plant.coverPhotoId)}" alt="" loading="lazy"></div>`;
    return `<div class="pthumb">${PlantArt.svg(sp)}</div>`;
  },

  /* ---------- PlantCard ---------- */
  PlantCard(p, todayTasks) {
    const sp = Garden.speciesById(p.speciesId);
    const status = Garden.plantStatus(p, todayTasks);
    const pending = todayTasks.filter(t => t.userPlantId === p.id && !t.completed);
    const age = Garden.ageDays(p);
    const garden = Garden.gardens().length > 1 ? (Garden.repo.byId('gardens', p.gardenId) || {}).name : '';
    const todayLine = pending.length ? `${TASK_META[pending[0].type].emoji} ${esc(pending[0].title)}${pending.length > 1 ? ` +${pending.length - 1}` : ''}` : '✅ วันนี้ไม่มีงานค้าง';
    return `<button class="pcard" data-act="open-plant" data-id="${p.id}" aria-label="ดูต้น ${esc(Garden.plantName(p))}">
      ${C.Thumb(p, sp)}
      <div class="pinfo">
        <div class="pname">${esc(Garden.plantName(p))}</div>
        <div class="pmeta">${age == null ? (p.plannedDate ? `วางแผนปลูก ${U.fmtDate(p.plannedDate, { year: false })}` : 'ยังไม่ได้ปลูก') : `ปลูกมาแล้ว <span class="num">${age}</span> วัน`}${garden ? ` · ${esc(garden)}` : ''}${p.nickname && sp ? ` · ${esc(sp.nameTh)}` : ''}</div>
        <div class="badge-row">${C.PlantStatusBadge(status)}</div>
        <div class="pmeta">วันนี้: ${todayLine}</div>
      </div>
      <span class="t-chev">${ICON.chev}</span>
    </button>`;
  },

  /* ---------- TaskCard ---------- */
  TaskCard(t, { showPlant = true, showDate = false } = {}) {
    const meta = TASK_META[t.type] || TASK_META.GENERAL;
    const future = t.dueDate > U.todayKey();
    const p = t.userPlantId ? Garden.plant(t.userPlantId) : null;
    const g = !p && t.gardenId ? Garden.repo.byId('gardens', t.gardenId) : null;
    return `<li class="task ${t.completed ? 'done' : ''}" data-task="${esc(t.id)}">
      <button class="tcheck" data-act="task-check" data-id="${esc(t.id)}" ${future ? 'disabled' : ''} aria-label="${t.completed ? 'ยกเลิกเสร็จ: ' : 'ทำเสร็จ: '}${esc(t.title)}" aria-pressed="${t.completed}">
        <span class="box">${ICON.check.replace('<svg', '<svg')}</span></button>
      <button class="t-body" data-act="open-task" data-id="${esc(t.id)}">
        <span class="t-title">${esc(t.title)}</span>
        <span class="t-meta"><span class="tag ${meta.tone}">${meta.emoji} ${meta.label}</span>
          ${t.overdue ? '<span class="tag danger">ค้างอยู่</span>' : ''}
          ${showDate ? `<span>${U.fmtDate(t.dueDate, { year: false })}</span>` : ''}
          ${showPlant && g ? `<span>${esc(g.name)}</span>` : ''}
          ${t.recurrence ? `<span class="tiny">${esc(t.recurrence)}</span>` : ''}</span>

/* ---------- Overlay: Modal / BottomSheet / Confirm / Toast ---------- */
const Overlay = {
  stack: [],
  open(html, { center = false, label = 'หน้าต่าง', onClose } = {}) {
    const root = document.getElementById('overlay-root');
    const el = document.createElement('div');
    el.className = 'overlay' + (center ? ' center' : '');
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab" aria-hidden="true"></div>${html}</div>`;
    el.addEventListener('click', e => { if (e.target === el) Overlay.close(); });
    const prevFocus = document.activeElement;
    root.appendChild(el);
    this.stack.push({ el, onClose, prevFocus });
    document.body.style.overflow = 'hidden';
    const f = el.querySelector('[autofocus], button, input, select, textarea');
    setTimeout(() => f && f.focus(), 30);
    hydratePhotos(el);
    return el;
  },
  update(html) {
    const top = this.stack[this.stack.length - 1]; if (!top) return;
    const sheet = top.el.querySelector('.sheet');
    sheet.innerHTML = `<div class="grab" aria-hidden="true"></div>${html}`;
    hydratePhotos(sheet);
  },
  close() {
    const top = this.stack.pop(); if (!top) return;
    top.el.remove();
    if (!this.stack.length) document.body.style.overflow = '';
    if (top.onClose) top.onClose();
    if (top.prevFocus && document.contains(top.prevFocus)) top.prevFocus.focus();
  },
  closeAll() { while (this.stack.length) this.close(); },
  get isOpen() { return this.stack.length > 0; },
  head(title) { return `<div class="sheet-head"><h2>${title}</h2><button class="icon-btn" data-act="close-overlay" aria-label="ปิด">${ICON.close}</button></div>`; },

  /** ConfirmationDialog — ใช้แทน confirm() ที่ถูกปิดในบาง environment */
  confirm({ title, text, okLabel = 'ยืนยัน', danger = false }) {
    return new Promise(resolve => {
      let done = false;
      const el = this.open(`<div style="display:grid;gap:12px;padding-top:8px"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
        <div class="btn-row"><button class="btn ghost" data-c="no">ยกเลิก</button><button class="btn ${danger ? 'danger' : 'primary'}" data-c="yes">${esc(okLabel)}</button></div></div>`,
        { center: true, label: title, onClose: () => { if (!done) resolve(false); } });
      el.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { done = true; resolve(b.dataset.c === 'yes'); Overlay.close(); }));
    });
  },
};

const Toast = {
  show(msg, { action, actionLabel, ms = 2800 } = {}) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status');
    el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(actionLabel)}</button>` : ''}`;
    if (action) el.querySelector('button').addEventListener('click', () => { action(); el.remove(); });
    root.appendChild(el);
    setTimeout(() => el.remove(), ms);
  },
};

function confetti(chars = ['🌸', '🌼', '🌱', '✨', '💮']) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('i');
    s.textContent = chars[i % chars.length];
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * .6) + 's';
    s.style.fontSize = (1 + Math.random()) + 'rem';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2800);
}

/** Lazy-load รูปจาก IndexedDB เมื่อเลื่อนมาถึง */
const _photoObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) { _photoObserver.unobserve(en.target); loadPhoto(en.target); } });
}, { rootMargin: '200px' }) : null;
async function loadPhoto(img) {
  const url = await PhotoStore.get(img.dataset.photo);
  if (url) img.src = url; else img.alt = 'ไม่พบรูป';
}
function hydratePhotos(root) {
  root.querySelectorAll('img[data-photo]:not([src])').forEach(img => _photoObserver ? _photoObserver.observe(img) : loadPhoto(img));
}

/* ==== ui/app.js ==== */
/* ============================================================
 * ui/app.js — Router, state, event delegation, boot
 * ============================================================ */
const App = {
  tab: 'today',
  stack: [],          // [{ view, params }]
  ui: {
    plantFilter: 'all', plantSort: 'care', calView: 'month', calMonth: null, calSel: null,
    detailTab: 'overview', form: null, taskDraft: {}, doc: null, ob: null, showDone: false, search: '',
  },
  root: null,
  bootError: null,

  current() { return this.stack.length ? this.stack[this.stack.length - 1] : { view: this.tab, params: {} }; },
  go(view, params = {}) { Overlay.closeAll(); this.stack.push({ view, params }); this.render({ scrollTop: true }); },
  replace(view, params = {}) { this.stack[this.stack.length - 1] = { view, params }; this.render({ scrollTop: true }); },
  back() { Overlay.closeAll(); this.stack.pop(); this.render({ scrollTop: true }); },
  setTab(tab) { Overlay.closeAll(); this.tab = tab; this.stack = []; this.render({ scrollTop: true }); },

  render({ scrollTop = false } = {}) {
    const root = this.root;
    if (this.bootError) { root.innerHTML = `<div class="wrap" style="padding-top:40px">${C.ErrorState({ action: 'reload' })}</div>`; return; }
    if (!Garden.db.user) { root.innerHTML = Views.onboarding(); this.afterRender(scrollTop); return; }
    const cur = this.current();
    const V = Views[cur.view];
    let body, title, isRoot = !this.stack.length;
    try {
      if (!V) throw new Error('no view');
      title = V.title ? V.title(cur.params) : '';
      body = V.render(cur.params);
    } catch (e) {
      console.error(e);
      body = C.ErrorState({ action: 'go-home' }); title = 'ขออภัย';
    }
    const banner = Garden.repo.persistent ? '' : `<div class="banner" role="status">เบราว์เซอร์นี้บันทึกข้อมูลไม่ได้ ข้อมูลจะหายเมื่อปิดหน้า ลองเปิดในหน้าต่างปกติ (ไม่ใช่โหมดส่วนตัว)</div>`;
    const scrollY = window.scrollY;
    root.innerHTML = `<div class="app">${C.BottomNavigation(this.tab)}<div class="main">${banner}${C.AppHeader({ title, back: !isRoot })}
      <main class="wrap" id="main" tabindex="-1">${body}</main></div></div>`;
    this.afterRender(scrollTop);
    if (!scrollTop) window.scrollTo(0, scrollY);
    if (V && V.after) V.after(cur.params, root);
  },
  afterRender(scrollTop) {
    hydratePhotos(this.root);
    if (scrollTop) { window.scrollTo(0, 0); const m = document.getElementById('main') || this.root.querySelector('h1'); if (m && this.stack.length) m.focus({ preventScroll: true }); }
    const h = document.getElementById('appHeader'); if (h) h.classList.toggle('scrolled', window.scrollY > 4);
  },
  refresh() { if (!Overlay.isOpen) this.render(); else this.render(); },
};

/* ---------- Actions (event delegation) ---------- */
const Actions = {
  'tab': el => App.setTab(el.dataset.tab),
  'back': () => App.back(),
  'go-home': () => App.setTab('today'),
  'reload': () => location.reload(),
  'retry': () => App.render(),
  'close-overlay': () => Overlay.close(),
  'open-plant': el => { App.ui.detailTab = 'overview'; App.go('plant', { id: el.dataset.id }); },
  'open-task': el => { App.ui.taskDraft = {}; App.go('task', { id: el.dataset.id }); },
  'open-species': el => App.go('species', { id: el.dataset.id }),
  'open-article': el => { Overlay.closeAll(); App.go('article', { id: el.dataset.id }); },
  'open-search': () => { App.ui.search = ''; App.go('search'); },
  'open-notifs': () => openNotifications(),
  'add-plant': el => { App.ui.form = null; App.go('plantForm', { speciesId: el.dataset.species || '' }); },
  'see-all-tasks': () => { App.ui.calView = 'today'; App.setTab('calendar'); },
  'see-all-plants': () => App.setTab('plants'),
  'toggle-done': () => { App.ui.showDone = !App.ui.showDone; App.render(); },

  async 'task-check'(el) {
    const id = el.dataset.id;
    const t = Garden.findTask(id);
    if (!t) return;
    if (t.completed) { await Garden.uncompleteTask(id); Toast.show('ยกเลิกสถานะเสร็จแล้ว'); App.render(); return; }
    // งานที่ต้องการผลลัพธ์ → เปิดรายละเอียด/sheet
    if (t.type === 'SOIL_CHECK') return openWaterSheet(t.userPlantId, t.id);
    if (t.type === 'PHOTO' || t.type === 'PLANTING' || t.type === 'FERTILIZER') { App.ui.taskDraft = {}; return App.go('task', { id }); }
    el.classList.add('pop');
    const li = el.closest('.task'); if (li) li.classList.add('done');
    await finishTask(id, {});
  },
};

async function finishTask(id, result) {
  const before = Garden.todayTasks().filter(t => !t.completed).length;
  const res = await Garden.completeTask(id, result);
  const after = Garden.todayTasks().filter(t => !t.completed).length;
  setTimeout(() => {
    if (App.current().view === 'task') App.back(); else App.render();
    if (res.planted) {
      const fd = Garden.firstDayProgress();
      celebrate(fd.hasPrep && !fd.active ? 'เก่งมาก! คุณปลูกต้นแรกแล้ว' : `ปลูก${Garden.plantName(Garden.plant(res.task.userPlantId))}แล้ว!`, 'จากนี้ระบบจะบอกงานดูแลให้ทุกวัน เริ่มจากตรวจดินพรุ่งนี้เช้า');
    } else if (before > 0 && after === 0) {
      celebrate('วันนี้ดูแลสวนครบแล้ว!', 'พรุ่งนี้กลับมาดูงานใหม่ได้เลย สวนของคุณกำลังเติบโต 🌱');
    } else {
      Toast.show(`✅ เสร็จแล้ว: ${res.task.title}${after ? ` · เหลืออีก ${after} งาน` : ''}`, { action: () => Garden.uncompleteTask(id).then(() => App.render()), actionLabel: 'เลิกทำ' });
    }
    res.newBadges.forEach((b, i) => setTimeout(() => Toast.show(`${b.emoji} ได้รับเหรียญ "${b.label}"`), 900 + i * 600));
  }, 260);
}

function celebrate(title, text) {
  confetti();
  Overlay.open(`<div class="celebrate"><div class="big" aria-hidden="true">🎉</div><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
    <button class="btn primary block" data-act="close-overlay" autofocus>เยี่ยมเลย</button></div>`, { center: true, label: title });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind) {
    const [obj, key] = el.dataset.bind.split('.');
    const target = App.ui[obj]; if (target) target[key] = el.type === 'checkbox' ? el.checked : el.value;
  }
  if (el.dataset && el.dataset.live && Actions[el.dataset.live]) Actions[el.dataset.live](el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.upload !== undefined && el.files && el.files[0]) handleUpload(el);
  else if (el.dataset && el.dataset.change && Actions[el.dataset.change]) Actions[el.dataset.change](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form && Actions[f.dataset.form]) { e.preventDefault(); Actions[f.dataset.form](f, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Overlay.isOpen) Overlay.close(); });
window.addEventListener('scroll', () => { const h = document.getElementById('appHeader'); if (h) h.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

async function handleUpload(input) {
  const plantId = input.dataset.upload, taskId = input.dataset.task;
  const file = input.files[0];
  const noteEl = document.getElementById('photoNote');
  const note = noteEl ? noteEl.value : '';
  try {
    Toast.show('กำลังบันทึกรูป...', { ms: 1200 });
    await Garden.addPhoto(plantId, file, note);
    if (taskId) { await finishTask(taskId, { photo: true }); return; }
    Toast.show('📷 บันทึกรูปแล้ว');
    Overlay.closeAll();
    App.render();
  } catch (err) {
    Toast.show(err.message === 'not-image' ? 'ไฟล์นี้ไม่ใช่รูปภาพ ลองเลือกรูปใหม่อีกครั้ง' : 'ขออภัย บันทึกรูปไม่สำเร็จ ลองอีกครั้งนะครับ', { ms: 4000 });
  }
  input.value = '';
}

/* ---------- Boot ---------- */
async function boot() {
  App.root = document.getElementById('app');
  App.root.innerHTML = C.LoadingState();
  try {
    let adapter;
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); adapter = new LocalStorageAdapter(STORAGE_KEY); }
    catch (e) { adapter = new MemoryAdapter(); }
    const repo = await new Repository(adapter).init();
    Garden.init(repo);
    U.setDayOffset(repo.db.meta.dayOffset || 0);
    ServiceRegistry.notifications = new NotificationService([new InAppNotificationChannel(repo)]);
    App.ui.calMonth = U.todayKey().slice(0, 7);
    App.ui.calSel = U.todayKey();
    await Garden.runDailyNotifications();
    App.bootError = null;
  } catch (e) {
    console.error(e);
    App.bootError = e;
  }
  App.render();
  // เมื่อเปิดแอปค้างข้ามวัน ให้รีเฟรชงานของวันใหม่
  let lastDay = U.todayKey();
  setInterval(async () => {
    if (U.todayKey() !== lastDay && Garden.db.user) { lastDay = U.todayKey(); await Garden.runDailyNotifications(); App.render(); }
  }, 60000);
}

function obValidate(ob) {
  const e = {};
  if (ob.step === 1 && !ob.name.trim()) e.name = 'ใส่ชื่อเล่นสั้น ๆ ก็ได้ครับ';
  if (ob.step === 2) { if (!ob.gardenName.trim()) e.gardenName = 'กรุณาตั้งชื่อสวน'; if (!ob.gardenType) e.gardenType = 'กรุณาเลือกรูปแบบการปลูก'; }
  if (ob.step === 3 && !ob.sunlight) e.sunlight = 'กรุณาเลือกปริมาณแดด (ถ้าไม่รู้ เลือก "ไม่แน่ใจ")';
  if (ob.step === 4) {
    if (!ob.speciesIds.length) e.speciesIds = 'เลือกต้นไม้อย่างน้อย 1 อย่าง';
    if (ob.plantedStatus === 'before') {
      if (!U.isValidKey(ob.plantedDate)) e.plantedDate = 'กรุณาเลือกวันที่ปลูก';
      else if (ob.plantedDate > U.todayKey()) e.plantedDate = 'วันที่ปลูกต้องไม่เกินวันนี้';
    }
  }
  return e;
}

Object.assign(Actions, {
  'ob-next'() {
    const ob = obState();
    ob.errors = obValidate(ob);
    if (Object.keys(ob.errors).length) { App.render(); const f = document.querySelector('.err-msg'); if (f) f.scrollIntoView({ block: 'center' }); return; }
    ob.step++; App.render({ scrollTop: true });
  },
  'ob-back'() { const ob = obState(); ob.errors = {}; ob.step = Math.max(0, ob.step - 1); App.render({ scrollTop: true }); },
  'ob-set'(el) { const ob = obState(); ob[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'gardenType') ob.typeUnsure = false; ob.errors = {}; App.render(); },
  'ob-type-unsure'() { const ob = obState(); ob.typeUnsure = true; ob.gardenType = 'pot'; ob.errors = {}; App.render(); },
  'ob-species'(el) {
    const ob = obState(); const id = el.dataset.id;
    ob.speciesIds = ob.speciesIds.includes(id) ? ob.speciesIds.filter(x => x !== id) : ob.speciesIds.concat(id);
    ob.errors = {}; App.render();
  },
  'ob-add-custom'() {
    const ob = obState();
    try {
      const sp = Garden.addCustomSpecies(ob.customName);
      if (!ob.speciesIds.includes(sp.id)) ob.speciesIds.push(sp.id);
      ob.customName = ''; ob.errors = {}; App.render();
      Toast.show(`เพิ่ม "${sp.nameTh}" แล้ว`);
    } catch (err) { Toast.show(err.message); }
  },
  async 'ob-finish'() {
    const ob = obState();
    try {
      await Garden.completeOnboarding(ob);
      await Garden.runDailyNotifications();
      ob.step = 6; App.render({ scrollTop: true });
    } catch (err) {
      Toast.show('ขออภัย สร้างสวนไม่สำเร็จ ลองอีกครั้งนะครับ');
    }
  },
  'ob-start'() { App.ui.ob = null; App.tab = 'today'; App.stack = []; App.render({ scrollTop: true }); },
});

/* Onboarding ต้องแสดงหน้า "พร้อมแล้ว" ก่อนเข้า dashboard แม้มี user แล้ว */
const _origRender = App.render.bind(App);
App.render = function (opts) {
  if (App.ui.ob && App.ui.ob.step === 6) { App.root.innerHTML = Views.onboarding(); App.afterRender(true); return; }
  return _origRender(opts);
};

/* ============================================================
 * ui/views/today.js — Dashboard "วันนี้"
 * ลำดับ: งานวันนี้ → ต้นที่ต้องดูแล → ปัญหา → ความคืบหน้า → ต้นไม้ทั้งหมด → ข้อมูลเพิ่มเติม
 * ============================================================ */
Views.today = {
  title: () => 'วันนี้',
  render() {
    const user = Garden.db.user;
    const tasks = Garden.todayTasks();
    const pending = tasks.filter(t => !t.completed);
    const done = tasks.filter(t => t.completed);
    const plants = Garden.plants();
    const fd = Garden.firstDayProgress();
    const today = U.todayKey();
    const pct = tasks.length ? (done.length / tasks.length) * 100 : 0;

    /* 1. HERO — ตอบ "วันนี้ต้องทำอะไร" ภายใน 3 วินาที */
    let heroMain;
    if (!plants.length) heroMain = `<h1>ยังไม่มีต้นไม้ในสวน</h1><p class="muted">เพิ่มต้นแรกแล้วเราจะบอกว่าต้องทำอะไรทุกวัน</p><button class="btn primary" data-act="add-plant">+ เพิ่มต้นไม้</button>`;
    else if (pending.length) heroMain = `<div class="hero-row"><span class="count num" aria-hidden="true">${pending.length}</span><h1>วันนี้สวนของคุณมี ${pending.length} อย่างที่ต้องทำ</h1></div>
      <div class="prog-row small"><span class="muted">ทำเสร็จแล้ว</span><span class="num"><b>${done.length}</b> / ${tasks.length}</span></div>${C.ProgressBar(pct, { label: 'ความคืบหน้าวันนี้', tone: 'pink' })}`;
    else if (tasks.length) heroMain = `<div class="hero-row"><span class="count" aria-hidden="true">🎉</span><h1>วันนี้ดูแลสวนครบแล้ว!</h1></div><p class="muted">เก่งมาก พรุ่งนี้กลับมาดูงานใหม่นะครับ</p>${C.ProgressBar(100, { label: 'ความคืบหน้าวันนี้', tone: 'pink' })}`;
    else heroMain = `<div class="hero-row"><span class="count" aria-hidden="true">🌿</span><h1>วันนี้ไม่มีงานที่ต้องทำ</h1></div><p class="muted">พักผ่อนได้เลย หรือเดินไปดูต้นไม้สักรอบก็ดีครับ</p>`;
    const hero = `<section class="hero" aria-labelledby="heroTitle"><p class="hello" id="heroTitle">👋 สวัสดีครับ คุณ${esc(user.name)} · ${U.fmtDate(today, { weekday: true })}</p>${heroMain}</section>`;

    /* 2. CHECKLIST */
    let checklist = '';
    if (fd.active) {
      const firstList = pending.filter(t => t.firstDay || t.type === 'PLANTING');
      const others = pending.filter(t => !(t.firstDay || t.type === 'PLANTING'));
      checklist = `<section class="section" aria-labelledby="fdTitle"><div class="section-head"><h2 id="fdTitle">🌱 ภารกิจแรกของคุณ</h2><span class="num"><b>${fd.done}</b> / ${fd.total}</span></div>
        ${C.ProgressBar((fd.done / fd.total) * 100, { label: 'ภารกิจแรก' })}
        ${C.Checklist(firstList)}
        ${others.length ? `<h3 style="margin-top:6px">📋 งานอื่นวันนี้</h3>${C.Checklist(others)}` : ''}</section>`;
    } else if (plants.length) {
      checklist = `<section class="section" aria-labelledby="tTitle"><div class="section-head"><h2 id="tTitle">📋 ภารกิจวันนี้</h2><button class="link-btn" data-act="see-all-tasks">ดูทั้งหมด</button></div>
        ${pending.length ? C.Checklist(pending) : C.EmptyState({ icon: '✅', title: 'ไม่มีงานค้าง', text: 'งานของวันนี้เสร็จหมดแล้ว' })}</section>`;
    }
    const doneBlock = done.length ? `<div><button class="link-btn" data-act="toggle-done" aria-expanded="${App.ui.showDone}">${App.ui.showDone ? '▾' : '▸'} เสร็จแล้ว ${done.length} งาน</button>${App.ui.showDone ? C.Checklist(done) : ''}</div>` : '';

    /* 3. ต้นไหนต้องดูแล */
    const needCare = plants.map(p => ({ p, n: pending.filter(t => t.userPlantId === p.id).length })).filter(x => x.n > 0);
    const careBlock = needCare.length ? `<section class="section" aria-labelledby="ncTitle"><h2 id="ncTitle">🪴 ต้นที่ต้องดูแลวันนี้</h2>
      <div class="mini-plants">${needCare.map(({ p, n }) => `<button class="mini-plant" data-act="open-plant" data-id="${p.id}" aria-label="${esc(Garden.plantName(p))} มี ${n} งาน">
        <div class="pthumb">${C.Thumb(p, Garden.speciesById(p.speciesId))}<span class="cnt num">${n}</span></div><span>${esc(Garden.plantName(p))}</span></button>`).join('')}</div></section>` : '';

    /* 4. ปัญหา */
    const problems = [];
    plants.forEach(p => {
      if (p.status === 'problem') problems.push({ p, text: `บันทึกอาการ: ${p.problemNote || 'มีปัญหา'}`, act: 'open-plant' });
      const w = Garden.overwaterWarning(p.id);
      if (w) problems.push({ p, text: w, act: 'open-plant' });
    });
    const probBlock = problems.length ? `<section class="section" aria-labelledby="pbTitle"><h2 id="pbTitle">⚠️ ปัญหาที่ต้องจัดการ</h2>
      <ul class="list-plain">${problems.map(x => `<li><button class="row-btn" data-act="${x.act}" data-id="${x.p.id}"><span class="r-ico" aria-hidden="true">🟠</span><span class="r-txt"><b>${esc(Garden.plantName(x.p))}</b><span class="r-sub">${esc(x.text)}</span></span>${ICON.chev}</button></li>`).join('')}</ul></section>` : '';

    /* 5. ความคืบหน้า */
    const growth = Garden.gardenGrowth();
    const badgeCount = Object.keys(Garden.db.badges).length;
    const progBlock = plants.length ? `<section class="card" aria-labelledby="prTitle"><div class="section-head"><h2 id="prTitle">🌱 ความคืบหน้าสวน</h2><span class="num" style="font-family:var(--font-display);font-size:1.3rem;color:var(--green-ink)">${growth}%</span></div>
      ${C.ProgressBar(growth, { label: 'สวนของคุณเติบโต' })}
      <p>คุณดูแลสวนมาแล้ว <b class="num">${Garden.careDays()}</b> วัน</p>
      <button class="row-btn" data-act="tab" data-tab="profile" style="box-shadow:none;background:var(--surface-2)"><span class="r-ico" aria-hidden="true">🏅</span><span class="r-txt"><b>เหรียญของฉัน ${badgeCount}/${BADGES.length}</b><span class="r-sub">${badgeCount ? BADGES.filter(b => Garden.db.badges[b.key]).map(b => b.emoji).join(' ') : 'ทำภารกิจแรกเพื่อรับเหรียญแรก'}</span></span>${ICON.chev}</button></section>` : '';

    /* 6. ต้นไม้ทั้งหมด */
    const statusCount = { normal: 0, needs_care: 0, problem: 0, flowering: 0, planning: 0 };
    plants.forEach(p => statusCount[Garden.plantStatus(p, tasks)]++);
    const plantsBlock = plants.length ? `<section class="section" aria-labelledby="mpTitle"><div class="section-head"><h2 id="mpTitle">🌸 ต้นไม้ของฉัน <span class="tiny num">${plants.length} ต้น</span></h2><button class="link-btn" data-act="see-all-plants">ดูทั้งหมด</button></div>
      <div class="badge-row">${Object.entries(statusCount).filter(([, n]) => n).map(([k, n]) => `<span class="tag ${PLANT_STATUS[k].tone}">${PLANT_STATUS[k].emoji} ${PLANT_STATUS[k].label} ${n}</span>`).join('')}</div>
      <div class="plant-grid">${plants.slice(0, 3).map(p => C.PlantCard(p, tasks)).join('')}</div>
      <button class="btn ghost" data-act="add-plant">+ เพิ่มต้นไม้</button></section>` : '';

    /* 7. ข้อมูลเพิ่มเติม */
    const tipArticle = KB_ARTICLES.find(a => a.id === 'water-when');
    const moreBlock = `<section class="section" aria-labelledby="moTitle"><h2 id="moTitle">ℹ️ ข้อมูลเพิ่มเติม</h2>
      <div id="weatherSlot">${C.WeatherCard(null, user.province)}</div>
      <button class="row-btn" data-act="open-article" data-id="${tipArticle.id}"><span class="r-ico" aria-hidden="true">💡</span><span class="r-txt"><b>${tipArticle.title}</b><span class="r-sub">${tipArticle.summary}</span></span>${ICON.chev}</button></section>`;

    return `<div class="page">${hero}<div class="grid-2"><div class="section" style="gap:20px">${checklist}${doneBlock}${careBlock}${probBlock}</div>
      <div class="section" style="gap:20px">${progBlock}${plantsBlock}${moreBlock}</div></div></div>`;
  },
  async after() {
    const w = await ServiceRegistry.weather.getCurrentWeather(Garden.db.user.province);
    const slot = document.getElementById('weatherSlot');
    if (slot && w && w.available) slot.innerHTML = C.WeatherCard(w, Garden.db.user.province);
  },
};

/* ============================================================
 * ui/views/plants.js — My Plants, Plant Detail, Plant Form, Species info
 * ============================================================ */
const PLANT_FILTERS = [['all', 'ทั้งหมด'], ['normal', 'ปกติ'], ['needs_care', 'ต้องดูแลวันนี้'], ['problem', 'มีปัญหา'], ['flowering', 'กำลังออกดอก'], ['planning', 'รอปลูก']];
const PLANT_SORTS = [['care', 'ต้องดูแลก่อน'], ['recent', 'ล่าสุด'], ['oldest', 'เก่าที่สุด'], ['name', 'ชื่อต้นไม้']];

Views.plants = {
  title: () => 'ต้นไม้ของฉัน',
  render() {
    const tasks = Garden.todayTasks();
    const all = Garden.plants();
    const f = App.ui.plantFilter, s = App.ui.plantSort;
    let list = all.map(p => ({ p, status: Garden.plantStatus(p, tasks), n: tasks.filter(t => t.userPlantId === p.id && !t.completed).length }));
    if (f !== 'all') list = list.filter(x => x.status === f);
    const order = { problem: 0, needs_care: 1, planning: 2, flowering: 3, normal: 4 };
    list.sort((a, b) => {
      if (s === 'recent') return b.p.createdAt.localeCompare(a.p.createdAt);
      if (s === 'oldest') return (a.p.plantedDate || '9999').localeCompare(b.p.plantedDate || '9999');
      if (s === 'name') return Garden.plantName(a.p).localeCompare(Garden.plantName(b.p), 'th');
      return (order[a.status] - order[b.status]) || (b.n - a.n);
    });
    const body = !all.length
      ? C.EmptyState({ icon: '🌱', title: 'ยังไม่มีต้นไม้', text: 'มาเริ่มปลูกต้นแรกกันเถอะ', action: 'add-plant', actionLabel: '+ เพิ่มต้นไม้' })
      : list.length ? `<div class="plant-grid">${list.map(x => C.PlantCard(x.p, tasks)).join('')}</div>`
        : C.EmptyState({ icon: '🔍', title: 'ไม่มีต้นไม้ในหมวดนี้', text: 'ลองเลือกตัวกรอง "ทั้งหมด"' });
    return `<div class="page"><div class="page-head"><h1>🌱 ต้นไม้ของฉัน</h1><p class="muted">${all.length} ต้น ในสวนของคุณ</p></div>
      ${all.length ? `<div class="chips scroll" role="group" aria-label="กรองต้นไม้">${PLANT_FILTERS.map(([k, l]) => `<button class="chip" aria-pressed="${f === k}" data-act="plant-filter" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="field" style="grid-template-columns:auto 1fr;align-items:center;gap:10px"><label for="pSort" class="small">เรียงตาม</label>
        <select class="input" id="pSort" data-change="plant-sort" style="max-width:240px">${PLANT_SORTS.map(([k, l]) => `<option value="${k}" ${s === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
      ${body}</div>
      ${all.length ? `<button class="btn primary fab" data-act="add-plant">+ เพิ่มต้นไม้</button>` : ''}`;
  },
};

Object.assign(Actions, {
  'plant-filter'(el) { App.ui.plantFilter = el.dataset.v; App.render(); },
  'plant-sort'(el) { App.ui.plantSort = el.value; App.render(); },
});

/* ---------------- Plant Detail ---------------- */
Views.plant = {
  title(p) { const pl = Garden.plant(p.id); return pl ? Garden.plantName(pl) : 'ต้นไม้'; },
  render({ id }) {
    const p = Garden.plant(id);
    if (!p) return C.EmptyState({ icon: '🍃', title: 'ไม่พบต้นไม้นี้', text: 'อาจถูกลบไปแล้ว', action: 'see-all-plants', actionLabel: 'กลับไปหน้าต้นไม้' });
    const sp = Garden.speciesById(p.speciesId);
    const tasks = Garden.todayTasks();
    const status = Garden.plantStatus(p, tasks);
    const age = Garden.ageDays(p);
    const stage = TaskEngine.growthStage(p, sp, U.todayKey());
    const myTasks = tasks.filter(t => t.userPlantId === p.id);
    const tab = App.ui.detailTab;
    const garden = Garden.repo.byId('gardens', p.gardenId);
    const gtype = GARDEN_TYPES.find(g => g.v === p.plantingType);

    const hero = `<div class="pd-hero">${p.coverPhotoId ? `<img data-photo="${p.coverPhotoId}" alt="รูป${esc(Garden.plantName(p))}">` : PlantArt.svg(sp)}
      ${p.plantedDate ? `<button class="btn sm pd-photo-btn" data-act="photo-sheet" data-id="${p.id}">📷 ถ่ายรูป</button>` : ''}</div>`;
    const head = `<div class="page-head"><h1>${sp ? sp.emoji : '🪴'} ${esc(Garden.plantName(p))}</h1>
      <p class="muted">${esc(sp ? sp.nameTh : '')}${sp && sp.scientificName ? ` · <i>${esc(sp.scientificName)}</i>` : ''}${garden ? ` · ${esc(garden.name)}` : ''}</p>
      <div class="badge-row">${C.PlantStatusBadge(status)}${gtype ? `<span class="tag">${gtype.emoji} ${gtype.label}</span>` : ''}${p.quantity > 1 ? `<span class="tag">${p.quantity} ต้น</span>` : ''}</div></div>`;
    const facts = `<div class="facts">
      <div class="fact"><div class="k">ปลูกวันที่</div><div class="v">${p.plantedDate ? U.fmtDate(p.plantedDate) : 'ยังไม่ปลูก'}</div></div>
      <div class="fact"><div class="k">อายุ</div><div class="v num">${age == null ? '-' : age + ' วัน'}</div></div>
      <div class="fact"><div class="k">ระยะ</div><div class="v">${stage.emoji} ${stage.label}</div></div></div>`;

    const problem = p.status === 'problem' ? `<div class="warn danger"><span aria-hidden="true">🟠</span><div style="flex:1"><b>มีปัญหา: ${esc(p.problemNote || 'กำลังติดตามอาการ')}</b><div class="small">ติดตามอาการทุก 2–3 วัน และถ่ายรูปเทียบ</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn sm green" data-act="resolve-problem" data-id="${p.id}">อาการดีขึ้นแล้ว</button><button class="btn sm ghost" data-act="doctor-for" data-id="${p.id}">ตรวจอาการอีกครั้ง</button></div></div></div>` : '';

    const quick = p.plantedDate ? `<div class="btn-row">
      <button class="btn primary" data-act="water-check" data-id="${p.id}">💧 ตรวจดิน</button>
      <button class="btn" data-act="doctor-for" data-id="${p.id}">🆘 มีปัญหา?</button></div>` : '';

    const tabs = [['overview', 'ภาพรวม'], ['care', 'การดูแล'], ['fert', 'ปุ๋ย'], ['photos', 'รูป'], ['history', 'ประวัติ']];
    const tabBar = `<div class="tabs" role="tablist" aria-label="ข้อมูลต้นไม้">${tabs.map(([k, l]) => `<button class="tab" role="tab" id="tab-${k}" aria-selected="${tab === k}" aria-controls="tabpanel" data-act="detail-tab" data-v="${k}">${l}</button>`).join('')}</div>`;

    let panel = '';
    if (tab === 'overview') {
      panel = `<section class="section"><h2>📋 งานวันนี้</h2>${myTasks.length ? C.Checklist(myTasks, { showPlant: false }) : `<p class="muted">วันนี้ไม่มีงานของต้นนี้ ✅</p>`}</section>
        ${p.plantedDate ? `<section class="card"><h2>🌸 การออกดอก</h2>${C.StagePath(p, sp)}
          <p class="small muted">${esc(sp ? sp.floweringNotes : '')} ระยะเวลาออกดอกขึ้นกับพันธุ์และสภาพแวดล้อม ไม่มีวันที่แน่นอน</p>
          ${p.flowering ? `<button class="btn ghost sm" data-act="toggle-flower" data-id="${p.id}">ดอกหมดแล้ว (กลับไปดูแลปกติ)</button>` : `<button class="btn sm" data-act="toggle-flower" data-id="${p.id}">🌸 ต้นนี้ออกดอกแล้ว</button>`}</section>` : ''}
        <section class="card"><h2>🗺️ เส้นทางการปลูก</h2>${C.PlantTimeline(p, sp)}</section>
        ${p.location || p.notes ? `<section class="card flat"><h3>📝 บันทึก</h3>${p.location ? `<p><span class="muted">ตำแหน่ง:</span> ${esc(p.location)}</p>` : ''}${p.notes ? `<p>${esc(p.notes)}</p>` : ''}</section>` : ''}`;
    } else if (tab === 'care') {
      const mm = Garden.sunlightMismatch(sp, garden && garden.sunlight);
      panel = `<div class="card"><div class="care-row"><div class="care-ico yellow" aria-hidden="true">☀️</div><div style="display:grid;gap:4px"><h3>แสง · ${esc(sp.sunlight.label)}</h3><p class="small">${esc(sp.sunlight.text)}</p></div></div>
          ${mm ? `<div class="warn"><span aria-hidden="true">⚠️</span><span>${esc(mm)}</span></div>` : ''}</div>
        ${C.WateringCard(p, sp)}
        <div class="card"><div class="care-row"><div class="care-ico green" aria-hidden="true">🟫</div><div style="display:grid;gap:4px"><h3>ดิน</h3><p class="small">${esc(sp.soilGuideline)}</p>${p.potSize ? `<p class="tiny">ขนาดกระถาง: ${esc((POT_SIZES.find(x => x.v === p.potSize) || {}).label || '')}</p>` : ''}</div></div></div>
        ${sp.temperatureNotes ? `<div class="card"><div class="care-row"><div class="care-ico pink" aria-hidden="true">🌡️</div><div style="display:grid;gap:4px"><h3>อากาศ</h3><p class="small">${esc(sp.temperatureNotes)}</p></div></div></div>` : ''}
        <div class="card"><div class="care-row"><div class="care-ico pink" aria-hidden="true">✂️</div><div style="display:grid;gap:4px"><h3>การตัดแต่ง</h3><p class="small">${esc(sp.pruningNotes)}</p></div></div></div>
        <div class="card"><div class="care-row"><div class="care-ico green" aria-hidden="true">🐛</div><div style="display:grid;gap:4px"><h3>แมลงและโรคที่พบบ่อย</h3><p class="small">${esc(sp.pestNotes)}</p>${sp.diseaseNotes ? `<p class="small">${esc(sp.diseaseNotes)}</p>` : ''}
          ${sp.commonProblems.length ? `<ul class="small" style="margin:4px 0 0;padding-left:18px">${sp.commonProblems.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div></div>
          <div class="warn"><span aria-hidden="true">🧤</span><span class="small">ถ้าจะใช้ยาฆ่าแมลงหรือสารกำจัดโรค อ่านฉลาก ใช้ตามอัตราที่ระบุ สวมอุปกรณ์ป้องกัน และเก็บให้พ้นเด็กและสัตว์เลี้ยง</span></div></div>`;
    } else if (tab === 'fert') {
      panel = p.plantedDate ? C.FertilizerCard(p, sp) : C.EmptyState({ icon: '🧪', title: 'ยังไม่ต้องใส่ปุ๋ย', text: 'ปลูกให้ต้นตั้งตัวก่อน ระบบจะเตือนเมื่อถึงรอบปุ๋ย' });
    } else if (tab === 'photos') {
      panel = `${C.PhotoUpload(p.id)}${C.PhotoTimeline(p)}`;
    } else if (tab === 'history') {
      const h = Garden.history(p.id);
      panel = h.length ? `<div class="card"><ul class="hist">${h.map(x => `<li><span aria-hidden="true">${x.emoji}</span><div><div>${esc(x.text)}</div><div class="h-at">${x.date ? U.fmtDate(x.date) : U.fmtDateTime(x.at)}${x.note ? ' · ' + esc(x.note) : ''}</div></div></li>`).join('')}</ul></div>`
        : C.EmptyState({ icon: '📖', title: 'ยังไม่มีประวัติ', text: 'เมื่อทำงานดูแล ตรวจดิน หรือใส่ปุ๋ย จะแสดงที่นี่' });
    }

    return `<div class="page">${hero}${head}${facts}${problem}${quick}${tabBar}<div id="tabpanel" role="tabpanel" aria-labelledby="tab-${tab}" class="section">${panel}</div>
      <hr class="sep"><div class="btn-row"><button class="btn ghost" data-act="edit-plant" data-id="${p.id}">✏️ แก้ไข</button><button class="btn danger" data-act="delete-plant" data-id="${p.id}">🗑️ ลบต้นนี้</button></div></div>`;
  },
};

Object.assign(Actions, {
  'detail-tab'(el) { App.ui.detailTab = el.dataset.v; App.render(); },
  async 'toggle-flower'(el) {
    const p = Garden.plant(el.dataset.id);
    await Garden.markFlowering(p.id, !p.flowering);
    if (p.flowering) { confetti(['🌸', '🌺', '🌼', '✨']); Toast.show(`🌺 ยินดีด้วย ${Garden.plantName(p)} ออกดอกแล้ว!`); await Garden.checkBadges(); }
    else Toast.show('กลับไปดูแลตามปกติ');
    App.render();
  },
  async 'resolve-problem'(el) { await Garden.setProblem(el.dataset.id, false); Toast.show('🟢 ดีใจด้วย! เปลี่ยนสถานะเป็นปกติแล้ว'); App.render(); },
  'edit-plant'(el) { App.ui.form = null; App.go('plantForm', { id: el.dataset.id }); },
  async 'delete-plant'(el) {
    const p = Garden.plant(el.dataset.id);
    const ok = await Overlay.confirm({ title: `ลบ "${Garden.plantName(p)}"?`, text: 'ประวัติการดูแล รูปภาพ และงานของต้นนี้จะถูกลบด้วย และกู้คืนไม่ได้', okLabel: 'ลบต้นนี้', danger: true });
    if (!ok) return;
    await Garden.deletePlant(p.id);
    App.stack = []; App.tab = 'plants'; App.render({ scrollTop: true });
    Toast.show('ลบต้นไม้แล้ว');
  },
  'photo-sheet'(el) {
    Overlay.open(`${Overlay.head('📷 บันทึกรูปต้นไม้')}
      ${C.Field({ id: 'photoNote', label: 'หมายเหตุ (ไม่บังคับ)', html: '<input class="input" id="photoNote" maxlength="80" placeholder="เช่น แตกใบใหม่ 2 ใบ">' })}
      ${C.PhotoUpload(el.dataset.id)}`, { label: 'ถ่ายรูปต้นไม้' });
  },
  async 'view-photo'(el) {
    const ph = Garden.repo.byId('photoLogs', el.dataset.id); if (!ph) return;
    Overlay.open(`${Overlay.head('📷 ' + U.fmtDate(U.isoToKey(ph.capturedAt)))}
      <img data-photo="${ph.id}" alt="รูปต้นไม้" style="border-radius:16px;width:100%">${ph.note ? `<p>${esc(ph.note)}</p>` : ''}
      <button class="btn danger" data-act="delete-photo" data-id="${ph.id}">ลบรูปนี้</button>`, { label: 'ดูรูป' });
  },
  async 'delete-photo'(el) {
    Overlay.close();
    const ok = await Overlay.confirm({ title: 'ลบรูปนี้?', text: 'ลบแล้วกู้คืนไม่ได้', okLabel: 'ลบรูป', danger: true });
    if (!ok) return;
    await Garden.deletePhoto(el.dataset.id); Toast.show('ลบรูปแล้ว'); App.render();
  },
});

/* ---------------- Plant Form (add / edit) ---------------- */
function plantFormState(params) {
  if (App.ui.form && App.ui.form._for === (params.id || 'new')) return App.ui.form;
  const p = params.id ? Garden.plant(params.id) : null;
  const g = Garden.gardens()[0];
  App.ui.form = p ? {
    _for: p.id, speciesId: p.speciesId, nickname: p.nickname, gardenId: p.gardenId, plantedState: p.plantedDate ? 'before' : 'notyet',

Object.assign(Actions, {
  'pf-species'(el) { App.ui.form.speciesId = el.dataset.id; App.ui.form.errors = {}; App.render(); },
  'pf-set'(el) {
    const f = App.ui.form; f[el.dataset.k] = el.dataset.v;
    if (el.dataset.k === 'plantedState' && el.dataset.v === 'today') f.plantedDate = U.todayKey();
    if (el.dataset.k === 'plantedState' && el.dataset.v === 'before' && f.plantedDate === U.todayKey()) f.plantedDate = '';
    App.render();
  },
  'pf-rerender'() { App.render(); },
  'pf-add-custom'() {
    const f = App.ui.form;
    try { const sp = Garden.addCustomSpecies(f.customName); f.speciesId = sp.id; f.customName = ''; Garden.save(); App.render(); Toast.show(`เพิ่ม "${sp.nameTh}" แล้ว`); }
    catch (err) { Toast.show(err.message); }
  },
  async 'save-plant'() {
    const f = App.ui.form;
    const params = App.current().params;
    const data = {
      speciesId: f.speciesId, nickname: f.nickname, gardenId: f.gardenId, plantingType: f.plantingType, potSize: f.plantingType === 'pot' ? f.potSize : '',
      quantity: f.quantity, location: f.location, notes: f.notes,
      plantedDate: f.plantedState === 'today' ? U.todayKey() : f.plantedState === 'before' ? (f.plantedDate || 'invalid') : null,
      plannedDate: f.plantedState === 'notyet' ? f.plannedDate || null : null,
    };
    try {
      if (params.id) {
        await Garden.updatePlant(params.id, data);
        App.ui.form = null; App.back(); Toast.show('บันทึกแล้ว');
      } else {
        const p = Garden.addPlant(data);
        await Garden.save();
        await Garden.checkBadges();
        App.ui.form = null; App.ui.detailTab = 'overview';
        App.stack[App.stack.length - 1] = { view: 'plant', params: { id: p.id } };
        App.render({ scrollTop: true });
        Toast.show(`🌱 เพิ่ม${Garden.plantName(p)}แล้ว ระบบสร้างแผนดูแลให้เรียบร้อย`, { ms: 3500 });
      }
    } catch (err) {
      if (err.fields) {
        if (err.fields.plantedDate && data.plantedDate === 'invalid') err.fields.plantedDate = 'กรุณาเลือกวันที่ปลูก';
        f.errors = err.fields; App.render();
        const first = document.querySelector('.err-msg'); if (first) first.scrollIntoView({ block: 'center' });
      } else Toast.show('ขออภัย บันทึกไม่สำเร็จ ลองอีกครั้งนะครับ');
    }
  },
});

function soilButtons(selected, act, extra = '') {
  return `<div class="options cols-3 soil-opts" role="radiogroup" aria-label="สภาพดิน">${Object.entries(SOIL_RESULT).map(([k, r]) =>
    `<button type="button" class="option" role="radio" aria-checked="${selected === k}" data-act="${act}" data-v="${k}" ${extra}><span class="o-emoji" aria-hidden="true">${r.emoji}</span>${r.label.replace('ดิน', '')}</button>`).join('')}</div>`;
}
function soilAdvice(k) {
  const r = SOIL_RESULT[k]; if (!r) return '';
  return `<div class="advice ${r.tone}" role="status" aria-live="polite"><div class="a-title">${r.emoji} ${r.advice}</div><p class="small">${r.detail}</p></div>`;
}

Views.task = {
  title: () => 'งานวันนี้',
  render({ id }) {
    const t = Garden.findTask(id);
    if (!t) return C.EmptyState({ icon: '🍃', title: 'ไม่พบงานนี้', text: 'งานอาจถูกลบ หรือต้นไม้ถูกลบไปแล้ว', action: 'go-home', actionLabel: 'กลับหน้าวันนี้' });
    const p = t.userPlantId ? Garden.plant(t.userPlantId) : null;
    const sp = p ? Garden.speciesById(p.speciesId) : null;
    const meta = TASK_META[t.type] || TASK_META.GENERAL;
    const d = App.ui.taskDraft;
    const future = t.dueDate > U.todayKey();
    let interact = '', doneBtn = '';

    if (t.completed) {
      doneBtn = `<div class="info"><span aria-hidden="true">✅</span><span>ทำเสร็จแล้ว${t.completedAt ? ' เมื่อ ' + U.fmtDateTime(t.completedAt) : ''}</span></div>
        <button class="btn ghost" data-act="task-undo" data-id="${esc(t.id)}">ยกเลิกสถานะเสร็จ</button>`;
    } else if (future) {
      doneBtn = `<div class="info"><span aria-hidden="true">📅</span><span>งานนี้ถึงกำหนด ${U.fmtDate(t.dueDate, { weekday: true })} ยังไม่ต้องทำวันนี้</span></div>`;
    } else if (t.type === 'SOIL_CHECK') {
      interact = `<section class="section"><h2>ดินเป็นอย่างไร?</h2>${soilButtons(d.soil, 'td-soil')}${d.soil ? soilAdvice(d.soil) : ''}</section>`;
      if (d.soil === 'dry') doneBtn = `<div class="btn-row"><button class="btn primary" data-act="td-water-done" data-w="1">💧 รดน้ำแล้ว · เสร็จ</button><button class="btn ghost" data-act="td-water-done" data-w="0">ยังไม่ได้รด · บันทึกผล</button></div>`;
      else if (d.soil) doneBtn = `<button class="btn primary block" data-act="td-water-done" data-w="0">✅ เสร็จแล้ว</button>`;
      else doneBtn = `<p class="tiny" style="text-align:center">เลือกผลตรวจด้านบนก่อน แล้วปุ่ม "เสร็จแล้ว" จะขึ้นมา</p>`;
    } else if (t.type === 'PLANTING' && t.checklist) {
      const st = d.steps || {};
      const all = t.steps.every((_, i) => st[i]);
      interact = `<section class="section"><h2>ติ๊กทีละขั้น</h2><ul class="substeps">${t.steps.map((s, i) => `<li><label><input type="checkbox" data-change="td-step" data-i="${i}" ${st[i] ? 'checked' : ''}><span>${esc(s)}</span></label></li>`).join('')}</ul>
        <p class="small muted">ปลูกเสร็จแล้ว ระบบจะเริ่มนับวันและสร้างงานดูแลประจำวันให้</p></section>`;
      doneBtn = `<button class="btn primary block" data-act="td-complete" ${all ? '' : 'disabled'}>✅ ปลูกเสร็จแล้ว</button>${all ? '' : `<p class="tiny" style="text-align:center">ติ๊กครบทุกขั้นแล้วกดเสร็จได้</p>`}`;
    } else if (t.type === 'PHOTO' && p) {
      interact = `<section class="section">${C.Field({ id: 'photoNote', label: 'หมายเหตุ (ไม่บังคับ)', html: '<input class="input" id="photoNote" maxlength="80" placeholder="เช่น ใบเยอะขึ้น">' })}${C.PhotoUpload(p.id, { taskId: t.id })}</section>`;
      doneBtn = `<button class="btn ghost block" data-act="td-complete">ข้ามรูปครั้งนี้ · ทำเสร็จ</button>`;
    } else if (t.type === 'FERTILIZER' && p) {
      const last = Garden.lastFertilizer(p.id);
      const since = last ? U.diffDays(U.todayKey(), last.appliedAt) : null;
      const recent = since != null && sp && since < sp.fertIntervalDays / 2;
      interact = `<section class="section">
        <div class="warn"><span aria-hidden="true">⚠️</span><span>ใช้อัตราตามฉลากผลิตภัณฑ์เป็นหลัก อย่าเพิ่มปริมาณเองเพราะคิดว่าจะโตเร็วขึ้น</span></div>
        ${recent ? `<div class="info"><span aria-hidden="true">💡</span><span>เพิ่งใส่ปุ๋ยไปเมื่อ ${since} วันก่อน (${esc(last.fertilizerName)}) <b>ไม่ต้องใส่ซ้ำ</b> กด "ข้ามรอบนี้" ได้เลย</span></div>` : ''}
        <div class="btn-row"><button class="btn green" data-act="fert-log" data-id="${p.id}" data-task="${esc(t.id)}">🧪 บันทึกการใส่ปุ๋ย</button><button class="btn ghost" data-act="td-complete" data-skip="1">ข้ามรอบนี้</button></div></section>`;
    } else if (t.type === 'PEST_CHECK' || t.type === 'DISEASE_CHECK') {
      doneBtn = `<div class="btn-row"><button class="btn primary" data-act="td-complete">✅ ไม่พบอะไรผิดปกติ</button><button class="btn" data-act="td-found-problem" data-plant="${p ? p.id : ''}" data-sym="${t.type === 'PEST_CHECK' ? 'pests' : 'unknown'}">🆘 พบปัญหา</button></div>`;
    } else {
      doneBtn = `<button class="btn primary block" data-act="td-complete">✅ เสร็จแล้ว</button>`;
    }

    const why = t.type === 'SOIL_CHECK' ? `<p class="small muted">💡 ทำไมไม่รดทุกวัน? เพราะวันที่ฝนตกหรืออากาศครึ้ม ดินแห้งช้า รดเพิ่มอาจทำให้รากเน่าได้</p>` : '';
    return `<div class="page">
      <div class="badge-row"><span class="tag ${meta.tone}">${meta.emoji} ${meta.label}</span>${t.overdue ? '<span class="tag danger">ค้างอยู่</span>' : ''}<span class="tag">${U.fmtDate(t.dueDate, { year: false })}</span>${t.recurrence ? `<span class="tag">${esc(t.recurrence)}</span>` : ''}</div>
      <section class="section"><p class="muted">วันนี้ทำอะไร?</p><h1>${esc(t.title)}</h1>${t.description ? `<p>${esc(t.description)}</p>` : ''}
        ${p ? `<button class="row-btn" data-act="open-plant" data-id="${p.id}" style="box-shadow:none;background:var(--surface-2)">${C.Thumb(p, sp).replace('class="pthumb"', 'class="pthumb" style="width:44px;height:44px;border-radius:12px"')}<span class="r-txt"><b>${esc(Garden.plantName(p))}</b><span class="r-sub">ดูข้อมูลต้นนี้</span></span>${ICON.chev}</button>` : ''}</section>
      ${t.steps && t.steps.length && !(t.type === 'PLANTING' && t.checklist) ? `<section class="card"><h2>ทำอย่างไร?</h2><ol class="steps">${t.steps.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol>${why}</section>` : ''}
      ${interact}
      <div class="section">${doneBtn}</div>
      ${t.source === 'custom' && !t.firstDay ? `<button class="link-btn" data-act="task-delete" data-id="${esc(t.id)}" style="color:var(--danger-ink)">ลบงานนี้</button>` : ''}
    </div>`;
  },
};

Object.assign(Actions, {
  'td-soil'(el) { App.ui.taskDraft.soil = el.dataset.v; App.render(); const a = document.querySelector('.advice'); if (a) a.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); },
  'td-step'(el) { const d = App.ui.taskDraft; d.steps = d.steps || {}; d.steps[el.dataset.i] = el.checked; App.render(); },
  async 'td-water-done'(el) {
    const { id } = App.current().params;
    const t = Garden.findTask(id);
    const soil = App.ui.taskDraft.soil;
    await Garden.logWater(t.userPlantId, { soilCondition: soil, watered: el.dataset.w === '1' });
    await finishTask(id, { soil, watered: el.dataset.w === '1' });
  },
  async 'td-complete'(el) {
    const { id } = App.current().params;
    await finishTask(id, el.dataset.skip ? { skipped: true } : { steps: App.ui.taskDraft.steps || null });
  },
  async 'task-undo'(el) { await Garden.uncompleteTask(el.dataset.id); Toast.show('ยกเลิกสถานะเสร็จแล้ว'); App.render(); },
  async 'task-delete'(el) {
    const ok = await Overlay.confirm({ title: 'ลบงานนี้?', text: 'งานนี้จะหายจากรายการและปฏิทิน', okLabel: 'ลบงาน', danger: true });
    if (!ok) return;
    await Garden.deleteCustomTask(el.dataset.id); App.back(); Toast.show('ลบงานแล้ว');
  },
  'td-found-problem'(el) { startDoctor({ plantId: el.dataset.plant || null, symptom: el.dataset.sym }); },
  'water-check'(el) { openWaterSheet(el.dataset.id, null); },
  'fert-log'(el) { openFertSheet(el.dataset.id, el.dataset.task || null); },
});

/* ---------------- Water Check (BottomSheet) ---------------- */
function openWaterSheet(plantId, taskId) {
  const p = Garden.plant(plantId);
  if (!p) return;
  const sp = Garden.speciesById(p.speciesId);
  const medium = TaskEngine.isMediumNotSoil(sp);
  const st = { soil: null };
  const draw = () => `${Overlay.head(`💧 ${medium ? 'ตรวจวัสดุปลูก' : 'ตรวจดิน'}${esc(Garden.plantName(p))}`)}
    <ol class="steps"><li><span>${medium ? 'ใช้นิ้วแตะวัสดุปลูกด้านใน' : 'ใช้นิ้วจิ้มดินลึกประมาณ 2–3 ซม.'}</span></li><li><span>สังเกตความชื้น</span></li><li><span>เลือกผลด้านล่าง</span></li></ol>
    <h3>ตอนนี้ดินเป็นอย่างไร?</h3>${soilButtons(st.soil, 'ws-soil')}

    ${st.soil ? `${C.Field({ id: 'wsNote', label: 'หมายเหตุ (ไม่บังคับ)', html: '<input class="input" id="wsNote" maxlength="80" placeholder="เช่น ฝนตกเมื่อคืน">' })}
      ${st.soil === 'dry' ? `<div class="btn-row"><button class="btn primary" data-act="ws-save" data-w="1">💧 บันทึกว่ารดน้ำแล้ว</button><button class="btn ghost" data-act="ws-save" data-w="0">ยังไม่รด · บันทึกผลตรวจ</button></div>`

      if (t) await finishTask(t.id, { soil: st.soil, watered }); else App.render();
    }
    const w = Garden.overwaterWarning(plantId);
    if (w && watered) setTimeout(() => Toast.show('⚠️ ' + w, { ms: 5000 }), 1200);

}

    return `${Overlay.head('🧪 บันทึกการใส่ปุ๋ย')}

      <div class="warn"><span aria-hidden="true">⚠️</span><span>ใช้อัตราตามฉลากผลิตภัณฑ์เป็นหลัก อย่าเพิ่มปริมาณปุ๋ยเองเพราะคิดว่าจะทำให้โตเร็วขึ้น</span></div>

          <button type="button" class="chip" role="radio" aria-checked="${st.mode === 'name'}" data-act="fz-mode" data-v="name">พิมพ์ชื่อเอง</button></div>` : ''}
        ${sel && st.mode === 'pick' && sel.labelRate ? `<div class="info"><span aria-hidden="true">🏷️</span><span>อัตราตามฉลากที่จดไว้: <b>${esc(sel.labelRate)}</b></span></div>` : ''}
        ${st.mode === 'name' ? C.Field({ id: 'fzName', label: 'ชื่อปุ๋ย', hint: 'ไม่รู้ชื่อ พิมพ์ว่า "ไม่ทราบชื่อ" ได้', err: E.fertilizerName, html: '<input class="input" id="fzName" maxlength="40" placeholder="เช่น ปุ๋ยคอก, ปุ๋ยสูตรเสมอ">' }) : ''}
        ${C.Field({ id: 'fzDate', label: 'วันที่ใส่', err: E.appliedAt, html: `<input class="input" type="date" id="fzDate" value="${U.todayKey()}" max="${U.todayKey()}">` })}
        ${C.Field({ id: 'fzAmt', label: 'ปริมาณที่ใช้ (ตามฉลาก)', hint: 'เช่น 1 ช้อนชา ตามฉลาก', html: '<input class="input" id="fzAmt" maxlength="40">' })}
        ${C.Field({ id: 'fzNote', label: 'หมายเหตุ (ไม่บังคับ)', html: '<input class="input" id="fzNote" maxlength="80">' })}
        <button class="btn green block" type="submit">บันทึก${taskId ? ' · เสร็จงานนี้' : ''}</button>
      </form>
      <button class="link-btn" data-act="fz-manage">⚙️ จัดการรายการปุ๋ยของฉัน</button>`;
  };
  Overlay.open(draw(), { label: 'บันทึกการใส่ปุ๋ย' });
  Actions['fz-pick'] = (el) => { st.mode = 'pick'; st.fertilizerId = el.dataset.id; Overlay.update(draw()); };
  Actions['fz-mode'] = () => { st.mode = 'name'; Overlay.update(draw()); };
  Actions['fz-manage'] = () => { Overlay.closeAll(); App.go('fertilizers'); };
  Actions['fz-save'] = async () => {
    const v = id => (document.getElementById(id) || {}).value || '';
    try {
      await Garden.logFertilizer(plantId, { fertilizerId: st.mode === 'pick' ? st.fertilizerId : null, fertilizerName: v('fzName'), appliedAt: v('fzDate'), amount: v('fzAmt'), note: v('fzNote') });
      Overlay.close();
      if (taskId) await finishTask(taskId, { fertilized: true });
      else {
        const t = Garden.todayTasks().find(x => x.userPlantId === plantId && x.type === 'FERTILIZER' && !x.completed);
        if (t) await finishTask(t.id, { fertilized: true }); else { Toast.show('🧪 บันทึกการใส่ปุ๋ยแล้ว'); App.render(); }
      }
    } catch (err) {
      if (err.fields) { st.errors = err.fields; Overlay.update(draw()); } else Toast.show('ขออภัย บันทึกไม่สำเร็จ ลองอีกครั้งนะครับ');
    }
  };
}

/* ============================================================
 * ui/views/calendar.js — Calendar: วันนี้ / สัปดาห์ / เดือน
 * ============================================================ */
function tasksOn(dk) { return dk === U.todayKey() ? Garden.todayTasks() : Garden.tasksForDate(dk); }
function countBadge(list) {
  if (!list.length) return '<span></span>';
  const left = list.filter(t => !t.completed).length;
  return `<span class="c-count num ${left === 0 ? 'all-done' : ''}" aria-hidden="true">${left === 0 ? '✓' : left}</span>`;
}
function dayAria(dk, list) {
  const left = list.filter(t => !t.completed).length;
  return `${U.fmtDate(dk, { weekday: true })}${list.length ? `, ${list.length} งาน${left ? ` เหลือ ${left}` : ' เสร็จครบ'}` : ', ไม่มีงาน'}`;
}

Views.calendar = {
  title: () => 'ปฏิทิน',
  render() {
    const v = App.ui.calView, today = U.todayKey();
    const sel = App.ui.calSel || today;
    const viewChips = `<div class="chips" role="group" aria-label="มุมมองปฏิทิน">${[['today', 'วันนี้'], ['week', 'สัปดาห์'], ['month', 'เดือน']].map(([k, l]) => `<button class="chip" aria-pressed="${v === k}" data-act="cal-view" data-v="${k}">${l}</button>`).join('')}</div>`;
    let body = '';
    if (!Garden.plants().length && !Garden.db.tasks.length) {
      body = C.EmptyState({ icon: '📅', title: 'ยังไม่มีงานในปฏิทิน', text: 'เพิ่มต้นไม้แล้วระบบจะสร้างงานดูแลให้อัตโนมัติ', action: 'add-plant', actionLabel: '+ เพิ่มต้นไม้' });
    } else if (v === 'today') {
      const list = Garden.todayTasks();
      body = `<section class="section"><div class="day-label">📅 วันนี้ · ${U.fmtDate(today, { weekday: true })}</div>${list.length ? C.Checklist(list) : C.EmptyState({ icon: '🌿', title: 'วันนี้ไม่มีงาน' })}</section>`;
    } else if (v === 'week') {
      const start = U.startOfWeek(sel);
      const days = Array.from({ length: 7 }, (_, i) => U.addDays(start, i));
      const lists = days.map(d => tasksOn(d));
      const end = days[6];
      body = `<div class="cal-head"><button class="icon-btn" data-act="cal-shift" data-n="-7" aria-label="สัปดาห์ก่อน">${ICON.back}</button>
        <h2 class="num">${U.fmtDate(start, { year: false })} – ${U.fmtDate(end)}</h2>
        <button class="icon-btn" data-act="cal-shift" data-n="7" aria-label="สัปดาห์ถัดไป" style="transform:scaleX(-1)">${ICON.back}</button></div>
        <div class="week-strip">${days.map((d, i) => `<button class="cal-day ${d === today ? 'today' : ''}" aria-pressed="${d === sel}" data-act="cal-pick" data-d="${d}" aria-label="${dayAria(d, lists[i])}"><span class="tiny" style="color:inherit">${U.TH_DAYS_SHORT[i]}</span><b>${U.parseKey(d).getDate()}</b>${countBadge(lists[i])}</button>`).join('')}</div>
        ${days.map((d, i) => lists[i].length ? `<div class="day-group"><div class="day-label">${d === today ? 'วันนี้ · ' : ''}${U.fmtDate(d, { weekday: true, year: false })}</div>${C.Checklist(lists[i])}</div>` : '').join('') || C.EmptyState({ icon: '🌿', title: 'สัปดาห์นี้ไม่มีงาน' })}`;
    } else {
      const ym = App.ui.calMonth || today.slice(0, 7);
      const [y, m] = ym.split('-').map(Number);
      const first = new Date(y, m - 1, 1);
      const gridStart = U.addDays(U.dateKey(first), -first.getDay());
      const cells = Array.from({ length: 42 }, (_, i) => U.addDays(gridStart, i));
      const trimmed = cells.slice(35).every(d => !d.startsWith(ym)) ? cells.slice(0, 35) : cells;
      const selList = tasksOn(sel);
      body = `<div class="cal-head"><button class="icon-btn" data-act="cal-month" data-n="-1" aria-label="เดือนก่อน">${ICON.back}</button>
        <h2>${U.TH_MONTHS[m - 1]} ${y + 543}</h2>
        <button class="icon-btn" data-act="cal-month" data-n="1" aria-label="เดือนถัดไป" style="transform:scaleX(-1)">${ICON.back}</button></div>
        <div class="cal-grid" role="grid" aria-label="ปฏิทินงาน">${U.TH_DAYS_SHORT.map(d => `<div class="cal-dow" role="columnheader">${d}</div>`).join('')}
        ${trimmed.map(d => { const l = tasksOn(d); return `<button class="cal-day ${d.startsWith(ym) ? '' : 'other'} ${d === today ? 'today' : ''}" aria-pressed="${d === sel}" data-act="cal-pick" data-d="${d}" aria-label="${dayAria(d, l)}"><span>${U.parseKey(d).getDate()}</span>${countBadge(l)}</button>`; }).join('')}</div>
        <p class="tiny">ตัวเลข = จำนวนงานที่ยังไม่เสร็จ · ✓ = เสร็จครบ</p>
        <section class="section"><div class="day-label">${sel === today ? '📅 วันนี้ · ' : ''}${U.fmtDate(sel, { weekday: true })}</div>
          ${selList.length ? C.Checklist(selList) : C.EmptyState({ icon: '🌿', title: 'ไม่มีงานวันนี้' })}</section>`;
    }
    return `<div class="page"><div class="page-head"><h1>📅 ปฏิทินดูแลสวน</h1></div>${viewChips}${body}
      <button class="btn ghost" data-act="add-task-sheet">+ เพิ่มงานเอง</button></div>`;
  },
};

function startDoctor({ plantId = undefined, symptom = null } = {}) {
  const plants = Garden.plants().filter(p => p.plantedDate);
  let step = 'q';
  if (!symptom) step = 'symptom';
  else if (plantId === undefined && plants.length) step = 'plant';
  App.ui.doc = { plantId: plantId || null, symptom, step, qi: 0, answers: {} };
  if (App.current().view === 'doctor') App.replace('doctor'); else App.go('doctor');
}

    const S = ServiceRegistry.diagnosis;
    const sym = S.getSymptoms().find(s => s.key === d.symptom);
    const p = d.plantId ? Garden.plant(d.plantId) : null;
    const sp = p ? Garden.speciesById(p.speciesId) : null;
    const chips = `<div class="badge-row">${sym ? `<span class="tag pink">${sym.emoji} ${sym.label}</span>` : ''}${p ? `<span class="tag green">🪴 ${esc(Garden.plantName(p))}</span>` : ''}</div>`;

    if (d.step === 'symptom') {
      return `<div class="page"><h1>อาการเป็นอย่างไร?</h1>${chips}<div class="sym-grid">${S.getSymptoms().map(s => `<button class="sym" data-act="doc-sym" data-sym="${s.key}">${`<span class="s-e" aria-hidden="true">${s.emoji}</span>`}${s.label}</button>`).join('')}</div></div>`;
    }

      const plants = Garden.plants().filter(x => x.plantedDate);
      return `<div class="page">${chips}<h1>เป็นกับต้นไหน?</h1><p class="muted">เลือกต้น เพื่อให้คำแนะนำตรงกับชนิดและอายุของต้น</p>

        <li><button class="row-btn" data-act="doc-plant" data-id=""><span class="r-ico" aria-hidden="true">❔</span><span class="r-txt"><b>ไม่ระบุต้น</b><span class="r-sub">ใช้คำแนะนำทั่วไป</span></span>${ICON.chev}</button></li></ul></div>`;
    }
    const qs = S.getQuestions(d.symptom);
    if (d.step === 'q') {
      const q = qs[d.qi];
      return `<div class="page">${chips}
        <div><div class="prog-row small"><span class="muted">คำถามที่ ${d.qi + 1} จาก ${qs.length}</span></div>${C.ProgressBar(((d.qi) / qs.length) * 100, { label: 'ความคืบหน้าคำถาม', tone: 'pink' })}</div>
        <div class="wz-body"><h1>${esc(q.text)}</h1>${q.hint ? `<p class="muted">${esc(q.hint)}</p>` : ''}
        <div class="options" role="radiogroup" aria-label="${esc(q.text)}">${q.options.map(([v, l]) => `<button class="option" role="radio" aria-checked="${d.answers[q.id] === v}" data-act="doc-answer" data-q="${q.id}" data-v="${v}"><b>${esc(l)}</b></button>`).join('')}</div></div>
        <div class="btn-row"><button class="btn ghost" data-act="doc-prev">← ย้อนกลับ</button></div></div>`;

    const r = S.diagnose({ symptom: d.symptom, answers: d.answers, species: sp, plantAgeDays: p ? Garden.ageDays(p) : null });
    const kb = (sym && sym.kb || []).map(id => KB_ARTICLES.find(a => a.id === id)).filter(Boolean);

      <section class="section"><h2>💭 ความเป็นไปได้</h2>${r.causes.map(c => `<div class="cause"><b>${esc(c.title)}</b><span class="small muted">${esc(c.why)}</span></div>`).join('')}</section>

      <p class="small muted">${esc(r.followUp)}</p>
      ${p ? `<button class="btn primary" data-act="doc-save">📌 บันทึกอาการ + เตือนติดตามใน 3 วัน</button>` : ''}

      <div class="btn-row"><button class="btn ghost" data-act="doctor-restart">ตรวจอาการอื่น</button><button class="btn ghost" data-act="go-home">กลับหน้าวันนี้</button></div></div>`;
  },
};

Object.assign(Actions, {
  'doctor-start'(el) { startDoctor({ symptom: el.dataset.sym }); },
  'doctor-for'(el) { startDoctor({ plantId: el.dataset.id, symptom: null }); },
  'doctor-restart'() { const d = App.ui.doc; startDoctor({ plantId: d ? d.plantId : undefined, symptom: null }); },
  'doc-sym'(el) {
    const d = App.ui.doc; d.symptom = el.dataset.sym; d.qi = 0; d.answers = {};
    d.step = (!d.plantId && Garden.plants().some(p => p.plantedDate)) ? 'plant' : 'q';
    App.render({ scrollTop: true });
  },
  'doc-plant'(el) { const d = App.ui.doc; d.plantId = el.dataset.id || null; d.step = 'q'; d.qi = 0; App.render({ scrollTop: true }); },
  'doc-answer'(el) {
    const d = App.ui.doc; d.answers[el.dataset.q] = el.dataset.v;
    const qs = ServiceRegistry.diagnosis.getQuestions(d.symptom);
    if (d.qi < qs.length - 1) d.qi++; else d.step = 'result';
    App.render({ scrollTop: true });
  },
  'doc-prev'() {
    const d = App.ui.doc;
    if (d.qi > 0) d.qi--; else if (Garden.plants().some(p => p.plantedDate) && d.step === 'q') { d.step = 'plant'; }
    else { App.back(); return; }
    App.render({ scrollTop: true });
  },
  async 'doc-save'() {
    const d = App.ui.doc;
    const r = ServiceRegistry.diagnosis.diagnose({ symptom: d.symptom, answers: d.answers, species: Garden.speciesById(Garden.plant(d.plantId).speciesId), plantAgeDays: Garden.ageDays(Garden.plant(d.plantId)) });
    await Garden.saveDoctorReport(d.plantId, d.symptom, d.answers, r, true);
    Toast.show('📌 บันทึกแล้ว เราจะเตือนให้ติดตามอาการใน 3 วัน', { ms: 3500 });
    App.ui.detailTab = 'overview';
    App.stack = [{ view: 'plant', params: { id: d.plantId } }]; App.tab = 'plants';
    App.render({ scrollTop: true });
  },
});

/* ---------------- Search (รองรับภาษาไทย) ---------------- */
function searchResults(q) {
  const n = U.norm(q);
  if (!n) return `<p class="muted">พิมพ์ชื่อต้นไม้ อาการ (เช่น ใบเหลือง) หรือเรื่องที่อยากรู้ (เช่น ปุ๋ย)</p>
    <div class="chips">${['ใบเหลือง', 'รดน้ำ', 'ปุ๋ย', 'ชบา', 'เพลี้ย', 'ไม่ออกดอก'].map(s => `<button class="chip" data-act="search-suggest" data-v="${s}">${s}</button>`).join('')}</div>`;
  const has = (...fields) => fields.some(f => U.norm(f).includes(n));
  const myPlants = Garden.plants().filter(p => { const sp = Garden.speciesById(p.speciesId); return has(Garden.plantName(p), sp && sp.nameTh, sp && sp.nameEn, p.location, p.notes); });
  const species = Garden.species().filter(s => has(s.nameTh, s.nameEn, s.scientificName, s.category, s.description));
  const arts = KB_ARTICLES.filter(a => has(a.title, a.summary, a.body.map(b => b.p || b.tip || b.warn || (b.steps || []).join(' ')).join(' ')));
  const syms = DOCTOR_SYMPTOMS.filter(s => has(s.label));
  const tasks = Garden.todayTasks().filter(t => has(t.title, t.description));
  const group = (title, items) => items.length ? `<section class="section"><h2>${title} <span class="tiny num">${items.length}</span></h2><ul class="list-plain">${items.join('')}</ul></section>` : '';
  const row = (act, id, ico, t, sub, extra = '') => `<li><button class="row-btn" data-act="${act}" ${id ? `data-id="${esc(id)}"` : ''} ${extra}><span class="r-ico" aria-hidden="true">${ico}</span><span class="r-txt"><b>${esc(t)}</b>${sub ? `<span class="r-sub">${esc(sub)}</span>` : ''}</span>${ICON.chev}</button></li>`;
  const html = group('🪴 ต้นไม้ของฉัน', myPlants.map(p => row('open-plant', p.id, (Garden.speciesById(p.speciesId) || {}).emoji || '🪴', Garden.plantName(p), Garden.ageDays(p) != null ? `ปลูกมาแล้ว ${Garden.ageDays(p)} วัน` : 'รอปลูก')))
    + group('📋 งานวันนี้', tasks.map(t => row('open-task', t.id, TASK_META[t.type].emoji, t.title, t.completed ? 'เสร็จแล้ว' : 'ยังไม่เสร็จ')))
    + group('🆘 อาการ', syms.map(s => row('doctor-start', '', s.emoji, s.label, 'เริ่มตรวจอาการ', `data-sym="${s.key}"`)))
    + group('🌸 ชนิดต้นไม้', species.map(s => row('open-species', s.id, s.emoji, s.nameTh, s.description)))
    + group('📚 บทความ', arts.map(a => row('open-article', a.id, '📖', a.title, a.summary)));
  return html || C.EmptyState({ icon: '🔍', title: `ไม่พบ "${q}"`, text: 'ลองคำอื่น เช่น ชื่อต้นไม้ หรืออาการที่เห็น' });
}

      Overlay.close(); Toast.show('บันทึกแล้ว'); App.render();
    };
  },
  'garden-sheet'(el) {
    const g = el.dataset.id ? Garden.repo.byId('gardens', el.dataset.id) : null;
    const v = g || { name: '', location: Garden.db.user.province, gardenType: 'pot', sunlight: 'unsure', soilType: '', notes: '' };
    const draw = (E = {}) => `${Overlay.head(g ? 'แก้ไขสวน' : '+ เพิ่มสวน')}<form class="form" data-form="save-garden" novalidate>
      ${C.Field({ id: 'gName', label: 'ชื่อสวน', err: E.name, html: `<input class="input" id="gName" value="${esc(v.name)}" maxlength="30" placeholder="เช่น สวนหน้าบ้าน">` })}
      ${C.Field({ id: 'gProv', label: 'จังหวัด', html: `<select class="input" id="gProv">${PROVINCES.map(p => `<option ${p.name === v.location ? 'selected' : ''}>${p.name}</option>`).join('')}</select>` })}
      ${C.Field({ id: 'gType', label: 'พื้นที่ปลูก', html: `<select class="input" id="gType">${GARDEN_TYPES.map(x => `<option value="${x.v}" ${x.v === v.gardenType ? 'selected' : ''}>${x.emoji} ${x.label}</option>`).join('')}</select>` })}
      ${C.Field({ id: 'gSun', label: 'แสงแดด', html: `<select class="input" id="gSun">${SUN_OPTIONS.map(x => `<option value="${x.v}" ${x.v === v.sunlight ? 'selected' : ''}>${x.label}</option>`).join('')}</select>` })}
      ${C.Field({ id: 'gSoil', label: 'ลักษณะดิน (ไม่บังคับ)', hint: 'เช่น ดินเหนียว, ดินร่วน, ดินผสมถุง', html: `<input class="input" id="gSoil" value="${esc(v.soilType)}" maxlength="40">` })}
      ${C.Field({ id: 'gNotes', label: 'หมายเหตุ (ไม่บังคับ)', html: `<textarea class="input" id="gNotes" maxlength="200">${esc(v.notes)}</textarea>` })}
      <button class="btn primary" type="submit">บันทึก</button>
      ${g && Garden.gardens().length > 1 ? `<button class="btn danger" type="button" data-act="delete-garden" data-id="${g.id}">ลบสวนนี้</button>` : ''}</form>`;
    Overlay.open(draw(), { label: 'สวน' });
    Actions['save-garden'] = async () => {
      const val = id => document.getElementById(id).value;
      const data = { name: val('gName'), location: val('gProv'), gardenType: val('gType'), sunlight: val('gSun'), soilType: val('gSoil'), notes: val('gNotes') };
      try {
        if (g) await Garden.updateGarden(g.id, data); else Garden.addGarden(data);
        Overlay.close(); Toast.show(g ? 'บันทึกแล้ว' : 'เพิ่มสวนแล้ว'); App.render();
      } catch (err) { Object.assign(v, data); Overlay.update(draw({ name: err.message })); }
    };
  },
  async 'delete-garden'(el) {
    const g = Garden.repo.byId('gardens', el.dataset.id);
    Overlay.close();
    const ok = await Overlay.confirm({ title: `ลบ "${g.name}"?`, text: 'ต้นไม้และประวัติทั้งหมดในสวนนี้จะถูกลบด้วย', okLabel: 'ลบสวน', danger: true });
    if (!ok) return;
    try { await Garden.deleteGarden(g.id); Toast.show('ลบสวนแล้ว'); App.render(); } catch (err) { Toast.show(err.message); }
  },
  'backup-sheet'() {
    const json = Garden.repo.exportJSON();
    Overlay.open(`${Overlay.head('💾 สำรอง / กู้คืนข้อมูล')}
      <p class="small muted">คัดลอกข้อความด้านล่างเก็บไว้ (เช่น ส่งเข้าแชทตัวเอง) เพื่อย้ายไปเครื่องอื่น ข้อมูลนี้ไม่รวมรูปภาพ</p>
      <textarea class="input" id="bkOut" readonly style="min-height:110px;font-size:.8rem">${esc(json)}</textarea>
      <button class="btn" data-act="copy-backup">📋 คัดลอกข้อมูลสำรอง</button>
      <hr class="sep"><form class="form" data-form="import-backup">${C.Field({ id: 'bkIn', label: 'กู้คืนจากข้อมูลสำรอง', hint: 'วางข้อความที่เคยคัดลอกไว้ ข้อมูลปัจจุบันจะถูกแทนที่', html: '<textarea class="input" id="bkIn" style="min-height:90px;font-size:.8rem"></textarea>' })}
      <button class="btn ghost" type="submit">กู้คืนข้อมูล</button></form>`, { label: 'สำรองข้อมูล' });
  },
  async 'copy-backup'() {
    const ta = document.getElementById('bkOut');
    try { await navigator.clipboard.writeText(ta.value); Toast.show('คัดลอกแล้ว'); }
    catch (e) { ta.focus(); ta.select(); Toast.show('เลือกข้อความให้แล้ว กดคัดลอกเองได้เลย'); }
  },
  async 'import-backup'() {
    const val = document.getElementById('bkIn').value.trim();
    if (!val) return Toast.show('กรุณาวางข้อมูลสำรองก่อน');
    const ok = await Overlay.confirm({ title: 'กู้คืนข้อมูล?', text: 'ข้อมูลในเครื่องนี้ตอนนี้จะถูกแทนที่ด้วยข้อมูลสำรอง', okLabel: 'กู้คืน' });
    if (!ok) return;
    try { await Garden.repo.importJSON(val); Overlay.closeAll(); App.stack = []; App.tab = 'today'; App.render({ scrollTop: true }); Toast.show('กู้คืนข้อมูลแล้ว'); }
    catch (e) { Toast.show('ข้อมูลสำรองไม่ถูกต้อง ลองคัดลอกใหม่อีกครั้ง', { ms: 4000 }); }
  },
  async 'dev-day'(el) {
    const n = Number(el.dataset.n);
    const off = n === 0 ? 0 : U.getDayOffset() + n;
    U.setDayOffset(off); Garden.db.meta.dayOffset = off; await Garden.save();
    await Garden.runDailyNotifications();
    Toast.show(n === 0 ? 'กลับเป็นวันจริงแล้ว' : `เลื่อนไปเป็น ${U.fmtDate(U.todayKey(), { weekday: true })}`);
    App.ui.calSel = U.todayKey(); App.ui.calMonth = U.todayKey().slice(0, 7);
    App.render();
  },
  async 'reset-all'() {
    const ok = await Overlay.confirm({ title: 'ลบข้อมูลทั้งหมด?', text: 'สวน ต้นไม้ ประวัติ และรูปทั้งหมดในเครื่องนี้จะถูกลบ และกู้คืนไม่ได้', okLabel: 'ลบทั้งหมด', danger: true });
    if (!ok) return;
    await PhotoStore.clear(); await Garden.repo.reset(); U.setDayOffset(0);
    App.ui.ob = null; App.stack = []; App.tab = 'today'; App.render({ scrollTop: true });
  },
});

function openNotifications() {
  const list = Garden.db.notifications;
  Overlay.open(`${Overlay.head('🔔 การแจ้งเตือน')}
    ${list.length ? `<ul class="list-plain">${list.map(n => `<li class="notif ${n.read ? '' : 'unread'}"><div><b>${esc(n.title)}</b><div class="small muted">${esc(n.body || '')}</div><div class="tiny">${U.fmtDateTime(n.createdAt)}</div></div>
      ${n.taskId ? `<button class="btn sm" data-act="open-task" data-id="${esc(n.taskId)}">ดู</button>` : n.plantId ? `<button class="btn sm" data-act="open-plant" data-id="${esc(n.plantId)}">ดู</button>` : '<span></span>'}</li>`).join('')}</ul>`
      : C.EmptyState({ icon: '🔔', title: 'ยังไม่มีการแจ้งเตือน', text: 'เมื่อถึงเวลาดูแลต้นไม้ เราจะแจ้งที่นี่' })}
    <p class="tiny">ตอนนี้แจ้งเตือนภายในแอป เมื่อเปิดแอปแต่ละวัน</p>`, { label: 'การแจ้งเตือน', onClose: () => App.render() });
  Garden.markAllRead();
}

boot();
</script>
</body></html>
